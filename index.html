function Revisar({user}){const [items,setItems]=useState([]),[idx,setIdx]=useState(0),[selected,setSelected]=useState(null),[show,setShow]=useState(false);const load=useCallback(()=>{const hoje=new Date().toISOString().slice(0,10);supabase.from('review_queue').select('*,questions(*,question_options(*))').eq('user_id',user.id).eq('concluida',false).lte('proxima_revisao',hoje).order('proxima_revisao').then(({data})=>setItems(data||[]))},[user]);useEffect(load,[]);const item=items[idx],q=item?.questions;if(!item)return html`<div><div class="pagehead"><h1>Revisões</h1><p>Repetição espaçada a partir dos seus erros e dúvidas.</p></div><div class="card empty">Nada vencido hoje. Bom sinal.</div></div>`;const opts=useMemo(()=>shuffle(q?.question_options||[]),[item?.id]);async function answer(id){setSelected(id);setShow(true);const ok=opts.find(o=>o.id===id)?.correta;if(ok)await supabase.from('review_queue').update({concluida:true,status:'dominando'}).eq('id',item.id);else await supabase.from('review_queue').update({proxima_revisao:new Date(Date.now()+86400000).toISOString().slice(0,10),status:'preciso_entender'}).eq('id',item.id)}return html`<div><div class="pagehead"><h1>Revisar</h1><p>${items.length} revisão(ões) para hoje.</p></div><div class="card p"><p class="qtext">${q.enunciado}</p>${opts.map((o,i)=>html`<button class=${'option '+(show?(o.correta?'correct':selected===o.id?'wrong':''):'')} onClick=${()=>!show&&answer(o.id)}>${String.fromCharCode(65+i)}. ${o.texto}</button>`)}${show&&html`<div style=${{marginTop:'15px'}}><p>${q.explicacao}</p><button class="btn primary" onClick=${()=>{setShow(false);setSelected(null);if(idx+1<items.length)setIdx(idx+1);else load()}}>Próxima revisão</button></div>`}</div></div>`}
function Simulados({user}){const [mode,setMode]=useState(null);if(mode)return html`<${MockRun} user=${user} total=${mode} onExit=${()=>setMode(null)}/>`;return html`<div><div class="pagehead"><h1>Simulados</h1><p>Treine sem receber resposta durante a prova.</p></div><div class="grid2"><${SimCard} title="Simulado completo" desc="70 questões · 25 gerais + 45 específicos" total=${70} go=${setMode}/><${SimCard} title="Treino rápido" desc="10 questões variadas" total=${10} go=${setMode}/><${SimCard} title="Treino intermediário" desc="30 questões variadas" total=${30} go=${setMode}/><${SimCard} title="Meia prova" desc="35 questões variadas" total=${35} go=${setMode}/></div></div>`}

function MockRun({user,total,onExit}){const [qs,setQs]=useState([]),[idx,setIdx]=useState(0),[ans,setAns]=useState({}),[done,setDone]=useState(false),[mockId,setMockId]=useState(null),[start]=useState(Date.now());useEffect(()=>{(async()=>{const {data:all}=await supabase.from('questions').select('*,disciplinas(slug,nome,peso_por_questao),question_options(*)').eq('ativa',true).limit(1000);let list=[];if(total===70){const gerais=shuffle((all||[]).filter(q=>DISC_GERAIS.has(q.disciplinas?.slug))).slice(0,25);const esp=shuffle((all||[]).filter(q=>!DISC_GERAIS.has(q.disciplinas?.slug))).slice(0,45);list=[...gerais,...esp]}else list=shuffle(all||[]).slice(0,total);list=list.map(q=>({...q,opts:shuffle(q.question_options||[])}));setQs(shuffle(list));const {data:m}=await supabase.from('mock_exams').insert({user_id:user.id,tipo:total===70?'oficial':'rapido_'+total,total_questoes:total}).select().single();setMockId(m?.id||null)})()},[]);async function finish(){let ac=0;const regs=qs.map((q,i)=>{const c=q.opts.find(o=>o.correta),ok=ans[q.id]===c?.id;if(ok)ac++;return{mock_exam_id:mockId,question_id:q.id,alternativa_escolhida:ans[q.id]||null,correta:ok,ordem:i}});if(mockId){await supabase.from('mock_exam_answers').insert(regs);await supabase.from('mock_exams').update({nota_ponderada:pct(ac,qs.length),finalizado_em:new Date().toISOString()}).eq('id',mockId)}setDone(true)}if(!qs.length)return html`<div class="card empty">Montando seu simulado…</div>`;if(done){const ac=qs.filter(q=>ans[q.id]===q.opts.find(o=>o.correta)?.id).length;const by={};qs.forEach(q=>{const n=q.disciplinas?.nome||'Outros';by[n]??={t:0,a:0};by[n].t++;if(ans[q.id]===q.opts.find(o=>o.correta)?.id)by[n].a++});return html`<div><div class="card p"><h2>Resultado</h2><div class="grid3"><div class="stat"><strong>${ac}/${qs.length}</strong><span>acertos</span></div><div class="stat"><strong>${pct(ac,qs.length)}%</strong><span>aproveitamento</span></div><div class="stat"><strong>${Math.round((Date.now()-start)/60000)} min function chooseTime(max,streak){const dow=new Date().getDay();let p=streak<=2?[5,10,10,15,15,15,20]:streak<=6?[10,15,15,20,20,25,30]:streak<=13?[15,20,25,30,30,45,45]:[15,20,25,30,45,45,60,75,90,120];if(dow===1)p=p.filter(x=>x<=30).concat([10,15,20]);p=p.filter(x=>x<=max);return p.length?p[Math.floor(Math.random()*p.length)]:Math.min(5,max)}

function Jornada({user,profile}){const [m,setM]=useState([]);useEffect(()=>{(async()=>{const [{count:q},{count:s},{count:r}]=await Promise.all([supabase.from('question_attempts').select('id',{count:'exact',head:true}).eq('user_id',user.id),supabase.from('mock_exams').select('id',{count:'exact',head:true}).eq('user_id',user.id).not('finalizado_em','is',null),supabase.from('review_queue').select('id',{count:'exact',head:true}).eq('user_id',user.id).eq('concluida',true)]);const st=profile?.sequencia_dias||0;setM([['Primeiros passos','3 dias de constância',st>=3],['Primeira peça','7 dias de constância',st>=7],['100 questões','Responder 100 questões',(q||0)>=100],['Primeiro simulado','Concluir um simulado',(s||0)>=1],['250 questões','Responder 250 questões',(q||0)>=250],['Erros virando aprendizado','Concluir 50 revisões',(r||0)>=50],['Constância de verdade','30 dias seguidos',st>=30]])})()},[user,profile]);const done=m.filter(x=>x[2]).length;return html`<div><div class="pagehead"><h1>Sua jornada</h1><p>Sem XP. Cada marco representa algo que você realmente fez.</p></div><div class="card p"><div class="between row"><div><h3 style=${{margin:'0 0 4px'}}>Painel da aprovação</h3><span style=${{color:'var(--muted)'}}>${done}/${m.length} peças conquistadas</span></div><span style=${{fontSize:'32px'}}>🧩</span></div><div class="piecegrid" style=${{marginTop:'18px'}}>${m.map(x=>html`<div class=${'piece '+(x[2]?'on':'')}>${x[2]?'✓':'🔒'}</div>`)}</div></div><div style=${{marginTop:'14px',display:'grid',gap:'10px'}}>${m.map((x,i)=>html`<div class="card p row"><div class=${'piece '+(x[2]?'on':'')} style=${{width:'46px'}}>${x[2]?'✓':i+1}</div><div><b>${x[0]}</b><div style=${{color:'var(--muted)',fontSize:'14px'}}>${x[1]}</div></div></div>`)}</div></div>`}
function Erros({user}){const [rows,setRows]=useState([]);useEffect(()=>{supabase.from('review_queue').select('*,questions(enunciado,disciplinas(nome))').eq('user_id',user.id).order('criado_em',{ascending:false}).limit(100).then(({data})=>setRows(data||[]))},[]);return html`<div><div class="pagehead"><h1>Caderno de erros</h1><p>O erro vira informação para a próxima revisão.</p></div><div class="card p">${rows.length?html`<table class="table"><thead><tr><th>Matéria</th><th>Questão</th><th>Status</th><th>Próxima</th></tr></thead><tbody>${rows.map(r=>html`<tr><td>${r.questions?.disciplinas?.nome||'—'}</td><td>${(r.questions?.enunciado||'').slice(0,80)}…</td><td>${r.concluida?'Dominada':r.status}</td><td>${r.concluida?'—':r.proxima_revisao}</td></tr>`)}</tbody></table>`:html`<div class="empty">Seu caderno ainda está limpo. Quando você errar, o sistema organiza a revisão.</div>`}</div></div>`}
function Perfil({user,profile,refresh}){const [nome,setNome]=useState(profile?.nome||''),[meta,setMeta]=useState(profile?.meta_diaria_minutos||180),[theme,setTheme]=useState(profile?.tema||'noite'),[mode,setMode]=useState(profile?.modo_aparencia||'dark');useEffect(()=>{document.documentElement.dataset.theme=theme;document.documentElement.dataset.mode=mode},[theme,mode]);async function save(){await supabase.from('profiles').update({nome,meta_diaria_minutos:Number(meta),tema:theme,modo_aparencia:mode}).eq('id',user.id);await refresh(user)}return html`<div><div class="pagehead"><h1>Perfil e aparência</h1><p>Seu progresso continua separado mesmo se outras pessoas usarem a plataforma.</p></div><div class="card p"><div class="field"><label>Nome</label><input class="input" value=${nome} onChange=${e=>setNome(e.target.value)}/></div><div class="field"><label>Meta diária em minutos</label><input class="input" type="number" min="15" max="180" value=${meta} onChange=${e=>setMeta(e.target.value)}/></div><div class="field"><label>Tema</label><select class="select" value=${theme} onChange=${e=>setTheme(e.target.value)}><option value="noite">Noite</option><option value="rosa">Rosa neon</option><option value="lilas">Lilás</option><option value="azul">Azul elétrico</option><option value="verde">Verde</option><option value="coral">Coral</option></select></div><div class="field"><label>Aparência</label><select class="select" value=${mode} onChange=${e=>setMode(e.target.value)}><option value="dark">Escuro</option><option value="claro">Claro</option></select></div><div class="row"><button class="btn primary" onClick=${save}>Salvar</button><button class="btn danger" onClick=${()=>supabase.auth.signOut()}>Sair da conta</button></div></div></div>`}
