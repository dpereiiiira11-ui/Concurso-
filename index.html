/* Vela viva: oscilacao organica da chama, cera escorrendo e consumo suave */

.pretty-candle.is-paused .flame-outer,.pretty-candle.is-paused .flame-inner{animation-play-state:paused}

/* Correção detalhada e contraste visual confortável */
.correcoes-detalhadas{display:grid;gap:14px}
.questao-corrigida{border-left:4px solid var(--line)}
.questao-corrigida.acertada{border-left-color:#53a88b}
.questao-corrigida.equivocada{border-left-color:#df9477}
.status-correcao{border-radius:40px;padding:6px 12px;font-size:12px;font-weight:700}
.status-correcao.ok{background:rgba(72,152,118,.14);color:var(--ink);border:1px solid rgba(72,152,118,.35)}
.status-correcao.erro{background:rgba(222,144,98,.14);color:var(--ink);border:1px solid rgba(222,144,98,.4)}
.alternativas-corrigidas{display:grid;gap:8px;margin:17px 0}
.alternativa-corrigida{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:12px;color:var(--ink);font-size:14px;line-height:1.5}
.alternativa-corrigida>span:first-child{font-weight:800;min-width:22px}
.alternativa-corrigida>span:nth-child(2){flex:1}
.alternativa-corrigida.certa{border-color:#74bfa4;background:color-mix(in srgb,#4a987b 12%,var(--card))}
.alternativa-corrigida.incorreta{border-color:#dba186;background:color-mix(in srgb,#bd896a 12%,var(--card))}
.alternativa-corrigida strong{font-size:11px;flex-shrink:0;align-self:center}
.justificativa-questao{border-radius:14px;border:1px solid var(--line);background:var(--soft);padding:16px;line-height:1.6}
.justificativa-questao p{margin:8px 0 0}
.historico-simulado{border-top:1px solid var(--line);padding:15px 0}
.historico-simulado small{display:block;color:var(--muted);margin-top:5px}
.aviso-retificacao{background:color-mix(in srgb,#c6a17f 12%,var(--card));color:var(--ink);border:1px solid #ae9075;border-radius:12px;padding:12px;line-height:1.55}
.subject-chip.on{background:color-mix(in srgb,var(--accent) 18%,var(--card));color:var(--ink);border:1px solid var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent)}
:root[data-theme="entrada"] .accent,:root[data-theme="tecnologico"] .accent,:root[data-theme="lilas"] .accent,:root[data-theme="noite"] .accent{background:#e5d8f7;color:#302145;border:1px solid #aa94cc}
@media(max-width:650px){.alternativa-corrigida{flex-wrap:wrap}.alternativa-corrigida strong{margin-left:30px}.questao-corrigida{padding:18px}}
</style>

function Biblioteca({setTab}){const [enfileiradas,setEnfileiradas]=useState(null),[abertos,setAbertos]=useState(()=>{try{return JSON.parse(localStorage.getItem('rumo_links_abertos')||'{}')}catch{return {}}}),[concluidos,setConcluidos]=useState(()=>{try{return JSON.parse(localStorage.getItem('rumo_assuntos_concluidos')||'{}')}catch{return {}}}),[materia,setMateria]=useState('Português'),[assunto,setAssunto]=useState(0),[anotacao,setAnotacao]=useState('');const bloco=TRILHA_RUMO.find(x=>x.materia===materia)||TRILHA_RUMO[0];const topico=bloco.assuntos[assunto]||bloco.assuntos[0];const key='rumo_trilha_'+materia+'_'+assunto;useEffect(()=>{setAnotacao(localStorage.getItem(key)||'')},[materia,assunto]);async function alimentarRevisao(){const nomes={'Português':'Português','Controle Externo':'Controle Externo','Direito Administrativo':'Direito Administrativo','Direito Constitucional':'Direito Constitucional','Matemática e Raciocínio Lógico':'Matemática e Raciocínio Lógico','Licitações e Contratos':'Licitações e Contratos (Lei 14.133/2021)','Legislação Institucional':'Legislação Institucional','Administração Financeira e Orçamentária':'Administração Financeira e Orçamentária'};const {data,error}=await supabase.rpc('iniciar_revisao_topico',{p_disciplina_nome:nomes[materia]||materia,p_topico_nome:topico});if(error)console.warn('Fila de revisão:',error);else setEnfileiradas(data||0)}function abrir(link){alimentarRevisao();setAbertos(prev=>{const next={...prev,[link]:new Date().toISOString()};localStorage.setItem('rumo_links_abertos',JSON.stringify(next));return next})}function concluir(){const id=materia+'::'+topico;setConcluidos(prev=>{const next={...prev,[id]:!prev[id]};localStorage.setItem('rumo_assuntos_concluidos',JSON.stringify(next));return next})}const recursos=AULAS_RUMO.filter(v=>v.materia===materia);const yt='https://www.youtube.com/results?search_query='+encodeURIComponent(materia+' '+topico+' aula completa para concursos FCC');const ytMario='https://www.youtube.com/results?search_query='+encodeURIComponent('professor Mario Tossan '+topico+' concurso');return html`<div><div class="pagehead"><span class="pill">ROTEIRO DE ESTUDO</span><h1>Videoaulas por assunto</h1><p>Escolha primeiro o assunto que precisa aprender. Avance pela trilha e pratique em seguida.</p></div><div class="card p" style=${{marginBottom:'16px'}}><label class="softnote">Matéria</label><div class="curriculum-subjects">${TRILHA_RUMO.map(x=>html`<button class=${'subject-chip '+(materia===x.materia?'on':'')} onClick=${()=>{setMateria(x.materia);setAssunto(0)}}>${x.materia} <small>· ${x.assuntos.length}</small></button>`)}</div><h2 style=${{marginTop:'23px'}}>Conteúdos para estudar</h2><p class="softnote">Clique num assunto para abrir aulas específicas. Roteiro de estudo baseado nas matérias do projeto, com tópicos complementares; confira o edital retificado para o conteúdo oficial completo.</p><div class="curriculum-topics">${bloco.assuntos.map((nome,i)=>html`<button class=${'curriculum-topic '+(assunto===i?'on':'')+(concluidos[materia+'::'+nome]?' completed':'')} onClick=${()=>setAssunto(i)}><span class="topic-number">${String(i+1).padStart(2,'0')}</span><b>${nome}</b><span aria-hidden="true">${concluidos[materia+'::'+nome]?'✓':'›'}</span></button>`)}</div></div><div class="card p" id="aula-detalhes"><span class="pill">${materia} · aula ${assunto+1} de ${bloco.assuntos.length}</span><h2>${topico}</h2><p>Aprenda o conceito, identifique exemplos e exceções e depois resolva questões sobre esse tema.</p><div class="lesson-actions"><a class=${"btn "+(abertos[yt]?"lesson-opened":"accent")} href=${yt} onClick=${()=>abrir(yt)} target="_blank" rel="noopener noreferrer">${abertos[yt]?"✓ Link aberto · buscar novamente":"▶ Encontrar aulas deste assunto"}</a><a class=${"btn "+(abertos[ytMario]?"lesson-opened":"secondary")} href=${ytMario} onClick=${()=>abrir(ytMario)} target="_blank" rel="noopener noreferrer">${abertos[ytMario]?"✓ Busca aberta · Mario Tossan":"Buscar Mario Tossan"}</a></div><p class="softnote" style=${{marginTop:'12px'}}>A busca abre aulas sobre o assunto exato. Os resultados e a disponibilidade são do YouTube; não são vídeos previamente validados um a um.</p>${recursos.length>0&&html`<div class="sourcebox" style=${{marginTop:'15px'}}><h3>Aulas e cursos complementares</h3>${recursos.map(v=>html`<div style=${{margin:'10px 0'}}><a class=${abertos[v.url]?"lesson-link-opened":""} href=${v.url} onClick=${()=>abrir(v.url)} target="_blank" rel="noopener noreferrer">${abertos[v.url]?"✓ ":""}${v.titulo} ↗</a><small class="softnote" style=${{display:'block'}}>${v.prof} · ${v.tipo==='playlist'?'playlist':v.tipo==='video'?'vídeo específico':'busca no YouTube'}</small></div>`)}</div>`}<div class="lesson-status"><span>${enfileiradas!==null?(enfileiradas>0?enfileiradas+" novas questões adicionadas à Revisão.":"Revisão atualizada conforme as questões disponíveis."):""} ${concluidos[materia+"::"+topico]?"✓ Assunto marcado como concluído":"Links abertos ficam destacados para você não se perder."}</span><button class="btn secondary" type="button" onClick=${concluir}>${concluidos[materia+"::"+topico]?"Desmarcar conclusão":"Marcar assunto como estudado"}</button></div><div class="field"><label>Minhas anotações deste assunto</label><textarea class="textarea" value=${anotacao} onInput=${e=>{setAnotacao(e.target.value);localStorage.setItem(key,e.target.value)}} placeholder="Escreva aqui o que entendeu..."></textarea></div><div class="row"><button class="btn primary" onClick=${()=>setTab('estudar')}>Praticar questões →</button><button class="btn secondary" onClick=${()=>setTab('revisar')}>Revisar</button></div></div></div>`}

function analisarRascunho(texto,tema){const t=texto.trim(),palavras=t.match(/[\p{L}À-ÿ]+(?:[-'][\p{L}À-ÿ]+)*/gu)||[],frases=t.split(/[.!?]+/).map(x=>x.trim()).filter(Boolean),paragrafos=t.split(/\n\s*\n|\n/).map(x=>x.trim()).filter(Boolean),avisos=[];if(palavras.length<120)avisos.push({titulo:'Desenvolvimento do texto',detalhe:'O texto tem '+palavras.length+' palavras. Verifique se a introdução, os argumentos e a conclusão foram desenvolvidos. O tamanho ideal depende do edital.'});if(paragrafos.length<3)avisos.push({titulo:'Organização em parágrafos',detalhe:'Identifique introdução, desenvolvimento e conclusão. Na transcrição, separe os parágrafos como no papel.'});if(frases.some(x=>x.split(/\s+/).length>42))avisos.push({titulo:'Frases muito extensas',detalhe:'Uma ou mais frases passam de 42 palavras. Vale verificar se uma pausa ou divisão melhora a clareza.'});if(/\s+[,;:.!?]/.test(t))avisos.push({titulo:'Espaço antes da pontuação',detalhe:'Há espaço antes de vírgula, ponto ou outro sinal. Revise a digitação ou a transcrição.'});if(/[,.!?;:][\p{L}À-ÿ]/u.test(t))avisos.push({titulo:'Espaço depois da pontuação',detalhe:'Pode faltar espaço depois de algum sinal de pontuação.'});if(/([!?.,])\1\1/.test(t))avisos.push({titulo:'Pontuação repetida',detalhe:'Verifique trechos com vários sinais iguais consecutivos.'});if(!/[.!?]$/.test(t))avisos.push({titulo:'Fechamento do texto',detalhe:'O texto termina sem ponto final ou outro sinal conclusivo.'});const conectivos=['portanto','contudo','entretanto','além disso','porém','assim','desse modo','logo','por conseguinte','em primeiro lugar','por outro lado'];if(!conectivos.some(c=>t.toLowerCase().includes(c)))avisos.push({titulo:'Conexão entre ideias',detalhe:'Observe se as relações entre argumentos estão claras. Conectivos podem ajudar, mas não precisam ser usados artificialmente.'});if(tema){const significativas=(tema.toLowerCase().match(/[\p{L}À-ÿ]{5,}/gu)||[]).filter(x=>!['sobre','entre','brasil','públicos','pública','importância'].includes(x));if(significativas.length&&!significativas.some(w=>t.toLowerCase().includes(w)))avisos.push({titulo:'Relação com o tema',detalhe:'Confira se os argumentos respondem diretamente à proposta sorteada. Esta verificação automática usa apenas palavras-chave e não consegue julgar o sentido do texto.'})}return {palavras:palavras.length,paragrafos:paragrafos.length,frases:frases.length,avisos:avisos.length?avisos:[{titulo:'Revisão inicial',detalhe:'Nenhum dos alertas simples foi identificado. Isso não significa ausência de erros gramaticais, nem substitui uma correção completa.'}]}}
function Redacao(){const [temasFeitos,setTemasFeitos]=useState(()=>{try{return JSON.parse(localStorage.getItem('rumo_redacao_temas_feitos')||'{}')}catch{return {}}}),[tema,setTema]=useState(()=>localStorage.getItem('rumo_redacao_tema')||''),[historico,setHistorico]=useState(()=>{try{return JSON.parse(localStorage.getItem('rumo_redacao_sorteios')||'[]')}catch{return []}}),[feito,setFeito]=useState(()=>localStorage.getItem('rumo_redacao_ultima')||''),[texto,setTexto]=useState(()=>localStorage.getItem('rumo_redacao_texto')||''),[resultado,setResultado]=useState(null);function sortear(){let restantes=TEMAS_REDACAO.filter(x=>!historico.includes(x));if(!restantes.length)restantes=[...TEMAS_REDACAO];const escolhido=restantes[Math.floor(Math.random()*restantes.length)];const novos=restantes.length===TEMAS_REDACAO.length?[escolhido]:[...historico,escolhido];setTema(escolhido);setHistorico(novos);setResultado(null);localStorage.setItem('rumo_redacao_tema',escolhido);localStorage.setItem('rumo_redacao_sorteios',JSON.stringify(novos))}function concluir(){if(!tema)return;const data=new Date().toISOString().slice(0,10);setFeito(data);setTemasFeitos(prev=>{const next={...prev,[tema]:data};localStorage.setItem('rumo_redacao_temas_feitos',JSON.stringify(next));return next});localStorage.setItem('rumo_redacao_ultima',data)}function revisar(){setResultado(analisarRascunho(texto,tema))}return html`<div><div class="pagehead"><span class="pill">PRÁTICA DE ESCRITA</span><h1>Redação da semana</h1><p>Treine sua escrita com constância: faça <b>pelo menos uma redação por semana</b>, de preferência à mão, como na prova.</p></div><div class="card p"><span class="pill">DESAFIO SEMANAL</span><h2>${tema||'Vamos sortear seu próximo tema?'}</h2><p class="softnote">Temas de atualidades, sociedade, cidadania e administração pública para praticar. São sugestões de treino, não propostas oficiais da banca. Antes de escrever, organize seus argumentos e reserve tempo para revisar.</p><div class="row" style=${{flexWrap:'wrap',gap:'10px',marginTop:'18px'}}><button class="btn accent" onClick=${sortear}>${tema?'Sortear outro tema':'Sortear tema'}</button><button class="btn secondary" disabled=${!tema} onClick=${concluir}>✓ Marcar redação como concluída</button></div>${temasFeitos[tema]&&html`<p class="softnote" style=${{marginTop:'12px'}}>✓ Você concluiu este tema em ${temasFeitos[tema].split('-').reverse().join('/')}. Pode escolher outro para continuar praticando.</p>`}</div><div class="card p" style=${{marginTop:'16px'}}><h2>Cole ou escreva sua redação</h2><p>Escreva no papel e depois digite, dite usando o microfone do teclado ou transcreva com um aplicativo. Cole ou escreva o texto aqui, <b>separando os parágrafos</b>.</p><div class="field"><label for="texto-redacao">Texto da redação</label><textarea id="texto-redacao" class="textarea" rows="12" value=${texto} onInput=${e=>{setTexto(e.target.value);localStorage.setItem('rumo_redacao_texto',e.target.value);setResultado(null)}} placeholder="Cole ou escreva aqui sua redação, com introdução, desenvolvimento e conclusão..."></textarea></div><div class="row" style=${{gap:'10px',flexWrap:'wrap'}}><button class="btn primary" disabled=${texto.trim().length<30} onClick=${revisar}>Revisar meu texto</button><span class="softnote">${texto.trim().length} caracteres</span></div><p class="softnote" style=${{marginTop:'12px'}}>Esta é uma revisão preliminar feita no próprio aparelho, sem enviar sua redação a uma IA. Ela identifica sinais simples de pontuação e estrutura; ainda não avalia gramática, argumentação, interpretação ou nota da banca com precisão.</p>${resultado&&html`<div class="writing-feedback"><h3>Resultado da revisão inicial</h3><p class="softnote">${resultado.palavras} palavras · ${resultado.paragrafos} parágrafos · ${resultado.frases} frases aproximadas</p>${resultado.avisos.map(x=>html`<div class="writing-alert"><b>${x.titulo}</b><p>${x.detalhe}</p></div>`)}<p class="softnote"><b>Nota:</b> não calculada nesta etapa. Uma pontuação exige critérios de correção definidos pela banca e análise linguística mais profunda.</p></div>`}</div><div class="card p" style=${{marginTop:'16px'}}><h3>Como treinar</h3><p>1. Sorteie um tema. 2. Escreva no papel. 3. Use a transcrição por voz do celular ou digite. 4. Cole o texto e confira os alertas. 5. Revise e marque a redação como feita.</p><p class="softnote">A correção detalhada por inteligência artificial e a leitura direta de fotos ainda dependem de integração segura com o serviço de IA.</p></div></div>`}
