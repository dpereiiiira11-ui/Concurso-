<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diário TCE-GO — Preparação Técnico Administrativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10131c;
    --panel:#1a2030;
    --panel-2:#212841;
    --line:#2c3350;
    --paper:#ece7d9;
    --paper-dim:#9aa0b4;
    --gold:#c99a3e;
    --gold-dim:#8a6d34;
    --teal:#4e9b7f;
    --brick:#c25b49;
    --brick-dim:#6e372e;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--paper);font-family:'IBM Plex Sans',sans-serif;}
  h1,h2,h3,.serif{font-family:'Newsreader',serif;}
  #root{min-height:100vh;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;background:var(--panel-2);color:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;}
  input:focus,select:focus,textarea:focus{outline:1px solid var(--gold);}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

  .app{display:flex;min-height:100vh;}
  .side{width:230px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:22px 0;display:flex;flex-direction:column;}
  .brand{padding:0 20px 20px 20px;border-bottom:1px solid var(--line);margin-bottom:14px;}
  .brand .k{font-size:11px;letter-spacing:.04em;color:var(--gold);}
  .brand h1{font-size:19px;margin:4px 0 2px 0;font-weight:600;line-height:1.15;}
  .brand .s{font-size:11.5px;color:var(--paper-dim);}
  .nav{display:flex;flex-direction:column;gap:1px;flex:1;overflow-y:auto;}
  .nav button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--paper-dim);padding:10px 20px;font-size:14px;border-left:2px solid transparent;}
  .nav button.active{color:var(--paper);background:var(--panel-2);border-left:2px solid var(--gold);}
  .nav button:hover:not(.active){color:var(--paper);}
  .nav .soon{opacity:.4;cursor:default;}
  .nav .grp{font-size:10.5px;color:var(--paper-dim);opacity:.7;padding:14px 20px 4px 20px;letter-spacing:.03em;}

  .main{flex:1;padding:34px 40px;max-width:1180px;}
  .row{display:flex;gap:18px;flex-wrap:wrap;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}
  .stat{min-width:160px;flex:1;}
  .stat .n{font-family:'Newsreader',serif;font-size:30px;font-weight:500;line-height:1;}
  .stat .l{font-size:12px;color:var(--paper-dim);margin-top:6px;}
  .stat .sub{font-size:11.5px;color:var(--gold);margin-top:4px;}

  .pagehead{margin-bottom:22px;}
  .pagehead h2{font-size:24px;margin:0 0 4px 0;font-weight:500;}
  .pagehead p{margin:0;color:var(--paper-dim);font-size:13.5px;}

  .barwrap{background:var(--panel-2);border-radius:20px;height:8px;overflow:hidden;margin-top:8px;}
  .bar{height:100%;background:var(--gold);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--paper-dim);font-weight:500;font-size:11.5px;padding:6px 8px;border-bottom:1px solid var(--line);}
  td{padding:8px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}

  .btn{background:var(--gold);color:#1a1508;border:none;padding:9px 16px;border-radius:var(--radius);font-size:13.5px;font-weight:600;}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--paper);font-weight:500;}
  .btn.danger{background:var(--brick);color:#fff;}
  .btn:disabled{opacity:.4;cursor:default;}

  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;border:1px solid var(--line);}
  .pill.ok{color:var(--teal);border-color:var(--teal);}
  .pill.bad{color:var(--brick);border-color:var(--brick);}
  .pill.gold{color:var(--gold);border-color:var(--gold);}

  .timer-display{font-family:'Newsreader',serif;font-size:64px;text-align:center;font-weight:500;letter-spacing:.02em;margin:10px 0;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;}
  label{display:block;font-size:12px;color:var(--paper-dim);margin-bottom:5px;}
  .field{margin-bottom:14px;}
  select,input,textarea{width:100%;}
  .list-item{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .list-item:hover{color:var(--gold);}
  .list-item:last-child{border-bottom:none;}
  .alt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;cursor:pointer;}
  .alt:hover{border-color:var(--gold);}
  .alt.correct{border-color:var(--teal);background:rgba(78,155,127,.08);}
  .alt.wrong{border-color:var(--brick);background:rgba(194,91,73,.08);}
  .alt .letra{font-family:'Newsreader',serif;font-weight:600;width:20px;flex-shrink:0;}
  .banner{padding:10px 20px;background:var(--panel-2);border-left:3px solid var(--line);font-size:12.5px;color:var(--paper-dim);margin-bottom:20px;}
  .empty{color:var(--paper-dim);font-size:13.5px;padding:20px 0;}

  /* ---- identidade visual por matéria ---- */
  .mat-strip{border-left:3px solid var(--mc, var(--gold));padding-left:12px;}
  .mat-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mc,var(--gold));margin-right:8px;}

  /* ---- áudio ---- */
  .audio-ctl{display:flex;align-items:center;gap:6px;margin:6px 0 14px 0;flex-wrap:wrap;}
  .audio-ctl button{background:var(--panel-2);border:1px solid var(--line);color:var(--paper);border-radius:20px;padding:5px 12px;font-size:12px;}
  .audio-ctl button.on{border-color:var(--gold);color:var(--gold);}
  .audio-ctl select{width:auto;padding:5px 8px;font-size:12px;}

  /* ---- modo foco ---- */
  .focus-bar{position:fixed;top:0;left:0;right:0;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--paper-dim);z-index:50;}
  .focus-main{padding-top:56px;max-width:760px;margin:0 auto;padding-left:24px;padding-right:24px;}

  /* ---- cronômetro circular ---- */
  .ring-wrap{display:flex;justify-content:center;margin:14px 0;}
  .ring-num{font-family:'Newsreader',serif;font-size:42px;font-weight:500;}
  .preset-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0;}
  .preset-btn{background:var(--panel-2);border:1px solid var(--line);color:var(--paper);padding:8px 14px;border-radius:20px;font-size:13px;}
  .preset-btn.active{border-color:var(--gold);color:var(--gold);}

  /* ---- microinterações ---- */
  @keyframes popIn{from{opacity:0;transform:scale(.9) translateY(4px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .pop{animation:popIn .25s ease-out;}
  @keyframes ringGrow{from{stroke-dashoffset:var(--circ);}to{stroke-dashoffset:var(--offset);}}

  /* ---- blocos de questões ---- */
  .block-progress{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:12.5px;color:var(--paper-dim);}
  .block-dots{display:flex;gap:4px;}
  .block-dot{width:7px;height:7px;border-radius:50%;background:var(--line);}
  .block-dot.done-ok{background:var(--teal);}
  .block-dot.done-bad{background:var(--brick);}

  /* ---- pausa / mini-jogo ---- */
  .overlay{position:fixed;inset:0;background:rgba(8,10,16,.86);display:flex;align-items:center;justify-content:center;z-index:100;}
  .overlay-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:32px;max-width:420px;width:92%;text-align:center;}
  .breath-circle{width:120px;height:120px;border-radius:50%;border:2px solid var(--teal);margin:20px auto;animation:breathe 4s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(.75);opacity:.6;}50%{transform:scale(1);opacity:1;}}
  .memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0;}
  .memory-card{aspect-ratio:1;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;}
  .memory-card.flipped{border-color:var(--gold);background:var(--panel);}
  .memory-card.matched{border-color:var(--teal);opacity:.5;}
  @media(max-width:820px){
    .app{flex-direction:column;}
    .side{width:100%;flex-direction:row;overflow-x:auto;padding:12px;border-right:none;border-bottom:1px solid var(--line);}
    .brand{display:none;}
    .nav{flex-direction:row;}
    .grid2,.grid3{grid-template-columns:1fr;}
    .main{padding:20px;}
  }
</style>

// ============================================================
// HELPERS

function fmtMin(mins){
  mins = Math.max(0, Math.round(mins||0));
  const h = Math.floor(mins/60), m = mins%60;
  return `${h}h${String(m).padStart(2,'0')}`;
}
function fmtClock(totalSeconds){
  totalSeconds = Math.max(0, Math.round(totalSeconds));
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = totalSeconds%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function daysBetween(a,b){
  return Math.ceil((new Date(b) - new Date(a)) / 86400000);
}
function startOfWeek(d){
  const dt = new Date(d); const day = (dt.getDay()+6)%7; // segunda=0
  dt.setDate(dt.getDate()-day); dt.setHours(0,0,0,0); return dt;
}
function startOfMonth(d){ const dt=new Date(d); dt.setDate(1); dt.setHours(0,0,0,0); return dt; }
function startOfDay(d){ const dt=new Date(d); dt.setHours(0,0,0,0); return dt; }

// classificação de desempenho por assunto/matéria
function classificacao(pct, n){
  if(n < 5) return {label:'poucas questões', cls:''};
  if(pct < 50) return {label:'crítico', cls:'bad'};
  if(pct < 60) return {label:'atenção', cls:'bad'};
  if(pct < 70) return {label:'evoluindo', cls:'gold'};
  if(pct < 80) return {label:'bom', cls:'gold'};
  if(pct < 90) return {label:'muito competitivo', cls:'ok'};
  return {label:'excelente domínio', cls:'ok'};
}

// ============================================================
// ÁUDIO — Text-to-Speech via Web Speech API do navegador
// ============================================================
const TTS_SUPPORTED = typeof window !== 'undefined' && 'speechSynthesis' in window;

function useSpeaker(){
  const [speaking, setSpeaking] = useState(false);
  const [paused, setPaused] = useState(false);
  const queueRef = useRef([]);

  function stop(){
    if(TTS_SUPPORTED) window.speechSynthesis.cancel();
    queueRef.current = [];
    setSpeaking(false); setPaused(false);
  }
  function speak(parts, rate){
    if(!TTS_SUPPORTED) return;
    stop();
    queueRef.current = parts.filter(Boolean);
    setSpeaking(true); setPaused(false);
    const next = () => {
      const text = queueRef.current.shift();
      if(text === undefined){ setSpeaking(false); return; }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'pt-BR'; u.rate = rate || 1;
      u.onend = next;
      u.onerror = next;
      window.speechSynthesis.speak(u);
    };
    next();
  }
  function togglePause(){
    if(!TTS_SUPPORTED || !speaking) return;
    if(paused){ window.speechSynthesis.resume(); setPaused(false); }
    else { window.speechSynthesis.pause(); setPaused(true); }
  }
  useEffect(() => () => { if(TTS_SUPPORTED) window.speechSynthesis.cancel(); }, []);
  return { speaking, paused, speak, stop, togglePause };
}

function AudioControls({parts, label='Ouvir'}){
  const speaker = useSpeaker();
  const [rate, setRate] = useState(()=> Number(localStorage.getItem('tce_audio_rate') || 1));
  function iniciar(){ speaker.speak(parts || [], rate); }
  function mudarVelocidade(v){
    const n=Number(v); setRate(n); localStorage.setItem('tce_audio_rate', String(n));
    if(speaker.speaking) speaker.speak(parts || [], n);
  }
  if(!TTS_SUPPORTED) return html`<div class="audio-ctl"><span style=${{fontSize:'12px',color:'var(--paper-dim)'}}>Áudio não disponível neste navegador.</span></div>`;
  return html`<div class="audio-ctl">
    ${!speaker.speaking
      ? html`<button onClick=${iniciar}>🔊 ${label}</button>`
      : html`<button class="on" onClick=${speaker.togglePause}>${speaker.paused?'▶ Continuar':'⏸ Pausar'}</button><button onClick=${iniciar}>↻ Recomeçar</button><button onClick=${speaker.stop}>⏹ Parar</button>`}
    <select value=${rate} onChange=${e=>mudarVelocidade(e.target.value)} aria-label="Velocidade do áudio">
      <option value="0.75">0,75x</option><option value="1">1x</option><option value="1.25">1,25x</option><option value="1.5">1,5x</option>
    </select>
  </div>`;
}

// ============================================================
// PAUSA ATIVA — oferecida após blocos longos de estudo
// ============================================================
const TIPOS_PAUSA = [
  {id:'respiracao', label:'Respiração de 1 minuto', seg:60},
  {id:'alongamento', label:'Alongamento', seg:60},
  {id:'agua', label:'Beber água', seg:20},
  {id:'olhar', label:'Olhar para longe da tela', seg:20},
  {id:'memoria', label:'Mini desafio de memória', seg:0},
];

function PausaAtiva({minijogosAtivado, onClose}){
  const [escolha, setEscolha] = useState(null);
  const [restante, setRestante] = useState(0);

  useEffect(() => {
    if(!escolha || escolha.id==='memoria' || restante<=0) return;
    const t = setInterval(()=> setRestante(r=>r-1), 1000);
    return ()=>clearInterval(t);
  }, [escolha, restante]);

  function escolher(tipo){
    setEscolha(tipo);
    setRestante(tipo.seg);
  }

  return html`
    <div class="overlay">
      <div class="overlay-card pop">
        ${!escolha && html`
          <div>
            <h3 class="serif" style=${{marginTop:0}}>Bloco concluído. Pausa rápida?</h3>
            <div style=${{display:'flex',flexDirection:'column',gap:'8px',margin:'18px 0'}}>
              ${TIPOS_PAUSA.filter(t=>t.id!=='memoria' || minijogosAtivado).map(t=>html`
                <button class="btn ghost" onClick=${()=>escolher(t)}>${t.label}</button>
              `)}
            </div>
            <button class="btn" onClick=${onClose}>Continuar estudando</button>
          </div>
        `}
        ${escolha && escolha.id==='memoria' && html`<${MemoryGame} onDone=${onClose}/>`}
        ${escolha && escolha.id!=='memoria' && html`
          <div>
            <h3 class="serif" style=${{marginTop:0}}>${escolha.label}</h3>
            ${escolha.id==='respiracao' && html`<div class="breath-circle"></div>`}
            <div class="timer-display" style=${{fontSize:'40px'}}>${restante>0?restante:'✓'}</div>
            <button class="btn" disabled=${restante>0} onClick=${onClose}>Voltar ao estudo</button>
          </div>
        `}
      </div>
    </div>
  `;
}

function MemoryGame({onDone}){
  const EMOJIS = ['⚖️','📘','🧮','🏛️','📊','📝'];
  const [cards] = useState(()=>{
    const pares = [...EMOJIS, ...EMOJIS].map((e,i)=>({id:i, val:e}));
    for(let i=pares.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pares[i],pares[j]]=[pares[j],pares[i]]; }
    return pares;
  });
  const [flipped, setFlipped] = useState([]);
  const [matched, setMatched] = useState([]);

  function clicar(i){
    if(flipped.length===2 || flipped.includes(i) || matched.includes(i)) return;
    const novo = [...flipped, i];
    setFlipped(novo);
    if(novo.length===2){
      const [a,b] = novo;
      if(cards[a].val === cards[b].val){
        setTimeout(()=>{ setMatched(m=>[...m,a,b]); setFlipped([]); }, 400);
      } else {
        setTimeout(()=> setFlipped([]), 700);
      }
    }
  }
  const concluido = matched.length === cards.length;

  return html`
    <div>
      <h3 class="serif" style=${{marginTop:0}}>Encontre os pares</h3>
      <div class="memory-grid">
        ${cards.map((c,i)=>{
          const aberta = flipped.includes(i) || matched.includes(i);
          let cls = 'memory-card';
          if(matched.includes(i)) cls+=' matched'; else if(flipped.includes(i)) cls+=' flipped';
          return html`<div class=${cls} onClick=${()=>clicar(i)}>${aberta?c.val:''}</div>`;
        })}
      </div>
      ${concluido ? html`
        <div>
          <p style=${{color:'var(--teal)'}}>Pausa concluída. Vamos voltar?</p>
          <button class="btn" onClick=${onDone}>Voltar ao estudo</button>
        </div>
      ` : html`<button class="btn ghost" onClick=${onDone}>Pular e voltar ao estudo</button>`}
    </div>
  `;
}

// ============================================================
// CRONÔMETRO CIRCULAR (SVG)
// ============================================================
function RingTimer({elapsedSec, targetSec}){
  const size = 200, stroke = 8, r = (size-stroke)/2, circ = 2*Math.PI*r;
  const pct = targetSec ? Math.min(1, elapsedSec/targetSec) : (elapsedSec%3600)/3600;
  const offset = circ * (1-pct);
  return html`
    <div class="ring-wrap">
      <svg width=${size} height=${size} viewBox="0 0 ${size} ${size}">
        <circle cx=${size/2} cy=${size/2} r=${r} fill="none" stroke="var(--panel-2)" strokeWidth=${stroke}/>
        <circle cx=${size/2} cy=${size/2} r=${r} fill="none" stroke="var(--gold)" strokeWidth=${stroke}
          strokeLinecap="round" strokeDasharray=${circ} strokeDashoffset=${offset}
          transform="rotate(-90 ${size/2} ${size/2})" style=${{transition:'stroke-dashoffset 1s linear'}}/>
        <text x="50%" y="50%" textAnchor="middle" dominantBaseline="middle" fill="var(--paper)"
          fontFamily="Newsreader, serif" fontSize="34" fontWeight="500">${fmtClock(elapsedSec).slice(0,5)}</text>
      </svg>
    </div>
  `;
}

const NAV_PRONTO = [

  {id:'timer', label:'Cronômetro'},
  {id:'estudar', label:'Estudar'},

function App(){
  const [tab, setTab] = useState('dashboard');
  const [perfil, setPerfil] = useState(null);
  const [materias, setMaterias] = useState([]);
  const [assuntos, setAssuntos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [activeSession, setActiveSession] = useState(null); // sessão em andamento (cronômetro)
  const [foco, setFoco] = useState(false);

  const reloadCore = useCallback(async () => {
    const [{data: p}, {data: m}, {data: a}, {data: sess}] = await Promise.all([
      supabase.from('perfil').select('*').limit(1).maybeSingle(),
      supabase.from('materias').select('*').order('ordem'),
      supabase.from('assuntos').select('*').order('ordem'),
      supabase.from('sessoes_estudo').select('*').in('status',['em_andamento','pausada']).order('data_inicio',{ascending:false}).limit(1).maybeSingle(),
    ]);
    setPerfil(p || null);
    setMaterias(m || []);
    setAssuntos(a || []);
    setActiveSession(sess?.data !== undefined ? sess : (sess||null));
    setLoading(false);
  }, []);

  useEffect(() => { if(configured) reloadCore(); }, [reloadCore]);

  if(!configured) return html`<${NotConfigured}/>`;
  if(loading) return html`<div style=${{padding:'40px',color:'var(--paper-dim)'}}>Carregando…</div>`;

  const diasFaltando = perfil ? daysBetween(new Date(), perfil.data_prova) : null;

  const conteudo = html`
    ${tab==='dashboard' && html`<${Dashboard} perfil=${perfil} materias=${materias} assuntos=${assuntos}/>`}
    ${tab==='plano' && html`<${PlanoHoje} perfil=${perfil} materias=${materias} assuntos=${assuntos}/>`}
    ${tab==='timer' && html`<${Timer} materias=${materias} assuntos=${assuntos} activeSession=${activeSession} onChange=${reloadCore} perfil=${perfil}/>`}
    ${tab==='estudar' && html`<${Estudar} materias=${materias} assuntos=${assuntos}/>`}
    ${tab==='questoes' && html`<${Questoes} materias=${materias} assuntos=${assuntos} perfil=${perfil}/>`}
    ${tab==='revisoes' && html`<${Revisoes} materias=${materias} assuntos=${assuntos}/>`}
    ${tab==='erros' && html`<${CadernoDeErros} materias=${materias} assuntos=${assuntos}/>`}
    ${tab==='simulados' && html`<${Simulados} materias=${materias} assuntos=${assuntos}/>`}
    ${tab==='pontos' && html`<${OndePercoPontos} materias=${materias} assuntos=${assuntos}/>`}
    ${tab==='seaproa' && html`<${SeAProvaFosseHoje}/>`}
    ${tab==='relatorios' && html`<${Relatorios} perfil=${perfil} materias=${materias} assuntos=${assuntos}/>`}
    ${tab==='calendario' && html`<${CalendarioEstudos} perfil=${perfil} materias=${materias}/>`}
    ${tab==='configuracoes' && html`<${Configuracoes} perfil=${perfil} onSaved=${reloadCore}/>`}
    ${tab==='perfil' && html`<${Perfil} perfil=${perfil} onSaved=${reloadCore}/>`}
  `;

  if(foco){
    return html`
      <div>
        <div class="focus-bar">
          <span>Modo foco — ${materias.length ? (NAV_PRONTO.find(n=>n.id===tab)?.label||'') : ''} ${activeSession ? ' · sessão em andamento' : ''}</span>
          <span>
            Meta diária: ${fmtMin(perfil?.meta_diaria_minutos||180)}
            <button class="btn ghost" style=${{marginLeft:'12px',padding:'4px 10px'}} onClick=${()=>setFoco(false)}>Sair do modo foco</button>
          </span>
        </div>
        <div class="focus-main">${conteudo}</div>
      </div>
    `;
  }

  return html`
    <div class="app">
      <div class="side">
        <div class="brand">
          <div class="k">${perfil?.concurso || 'TCE-GO 2026'}</div>
          <h1>Diário de Estudos</h1>
          <div class="s">${perfil?.cargo || ''}</div>
        </div>
        <div class="nav">
          ${NAV_PRONTO.map(n => html`
            <button class=${tab===n.id?'active':''} onClick=${()=>setTab(n.id)}>${n.label}</button>
          `)}
          <button class=${tab==='configuracoes'?'active':''} onClick=${()=>setTab('configuracoes')}>Configurações</button>
          <div class="grp">Fase 5 — em breve</div>
          ${NAV_EM_BREVE.map(n => html`<button class="soon" disabled>${n}</button>`)}
        </div>
        <div style=${{padding:'14px 20px',borderTop:'1px solid var(--line)'}}>
          <div style=${{fontSize:'10.5px',color:'var(--teal)',marginBottom:'10px'}}>● Supabase configurado</div>
          <button class="btn ghost" style=${{width:'100%',marginBottom:'12px'}} onClick=${()=>setFoco(true)}>Modo foco</button>
          ${diasFaltando!==null && html`
            <div class="stat">
              <div class="n" style=${{fontSize:'22px',color:'var(--gold)'}}>${diasFaltando}</div>
              <div class="l">dias até a prova</div>
            </div>
          `}
        </div>
      </div>
      <div class="main">${conteudo}</div>
    </div>
  `;
}

// DASHBOARD
// ============================================================
function Dashboard({perfil, materias, assuntos}){
  const [stats, setStats] = useState(null);

  useEffect(() => {
    (async () => {
      const now = new Date();
      const [{data: sessoes}, {data: respostas}, {data: errosAbertos}] = await Promise.all([
        supabase.from('sessoes_estudo').select('*').eq('status','finalizada'),
        supabase.from('respostas').select('*, questoes(assunto_id)'),
        supabase.from('erros').select('*').eq('resolvido', false),
      ]);

      const sw = startOfWeek(now), sm = startOfMonth(now), sd = startOfDay(now);
      const minHoje = (sessoes||[]).filter(s=>new Date(s.data_inicio)>=sd).reduce((a,s)=>a+(s.minutos||0),0);
      const minSemana = (sessoes||[]).filter(s=>new Date(s.data_inicio)>=sw).reduce((a,s)=>a+(s.minutos||0),0);
      const minMes = (sessoes||[]).filter(s=>new Date(s.data_inicio)>=sm).reduce((a,s)=>a+(s.minutos||0),0);
      const minTotal = (sessoes||[]).reduce((a,s)=>a+(s.minutos||0),0);

      // sequência de dias estudados
      const diasEstudados = new Set((sessoes||[]).map(s=>new Date(s.data_inicio).toDateString()));
      let streak = 0, cursor = new Date();
      while(diasEstudados.has(cursor.toDateString())){ streak++; cursor.setDate(cursor.getDate()-1); }

      const totalResp = (respostas||[]).length;
      const totalAcertos = (respostas||[]).filter(r=>r.correta).length;
      const ultimos7 = (respostas||[]).filter(r=>new Date(r.data) >= new Date(now-7*86400000));
      const acertos7 = ultimos7.filter(r=>r.correta).length;

      // separação por origem da questão (real FCC x inédita)
      const qIdToTipo = {};
      (respostas||[]).forEach(r=>{}); // placeholder, tipo vem do join abaixo
      const { data: questoesTipo } = await supabase.from('questoes').select('id, tipo');
      (questoesTipo||[]).forEach(q=>{ qIdToTipo[q.id]=q.tipo; });
      const porOrigem = { oficial:{total:0,acertos:0}, inedita:{total:0,acertos:0} };
      (respostas||[]).forEach(r=>{
        const t = qIdToTipo[r.questao_id] || 'inedita';
        porOrigem[t] = porOrigem[t] || {total:0,acertos:0};
        porOrigem[t].total++; if(r.correta) porOrigem[t].acertos++;
      });

      // desempenho por matéria
      const assuntoToMateria = {}; assuntos.forEach(a=>assuntoToMateria[a.id]=a.materia_id);
      const porMateria = {};
      (respostas||[]).forEach(r=>{
        const assuntoId = r.questoes?.assunto_id;
        const matId = assuntoToMateria[assuntoId];
        if(!matId) return;
        porMateria[matId] = porMateria[matId] || {total:0, acertos:0};
        porMateria[matId].total++;
        if(r.correta) porMateria[matId].acertos++;
      });
      const ranking = Object.entries(porMateria).map(([matId, v])=>({
        materia: materias.find(m=>m.id===matId)?.nome || '—',
        pct: v.total ? Math.round(v.acertos/v.total*100) : 0,
        total: v.total,
      })).filter(r=>r.total>=3).sort((a,b)=>b.pct-a.pct);

      const hojeStr = new Date().toISOString().slice(0,10);
      const revisoesPendentes = (errosAbertos||[]).filter(e=>e.proxima_revisao && e.proxima_revisao <= hojeStr).length;

      const errosPorAssunto = {};
      (errosAbertos||[]).forEach(e=>{ errosPorAssunto[e.assunto_id] = (errosPorAssunto[e.assunto_id]||0)+1; });
      const assuntosCriticos = Object.entries(errosPorAssunto)
        .map(([assuntoId, n])=>({ nome: assuntos.find(a=>a.id===assuntoId)?.nome || '—', n }))
        .sort((a,b)=>b.n-a.n).slice(0,5);

      // índice de recuperação de erros: dos conceitos que já foram revisados ao menos 1x,
      // quantos acabaram marcados como resolvidos (voltaram a acertar de forma consistente)
      const { data: todosErros } = await supabase.from('erros').select('revisoes_feitas, resolvido').gt('revisoes_feitas', 0);
      const recTotal = (todosErros||[]).length;
      const recResolvidos = (todosErros||[]).filter(e=>e.resolvido).length;
      const indiceRecuperacao = recTotal ? Math.round(recResolvidos/recTotal*100) : null;

      setStats({
        minHoje, minSemana, minMes, minTotal, streak,
        totalResp, totalAcertos,
        pctGeral: totalResp? Math.round(totalAcertos/totalResp*100):0,
        pct7: ultimos7.length? Math.round(acertos7/ultimos7.length*100):0,
        ranking, revisoesPendentes, assuntosCriticos, porOrigem, indiceRecuperacao,
      });
    })();
  }, [materias, assuntos]);

  const metaMin = perfil?.meta_diaria_minutos || 180;
  const pctMeta = stats ? Math.min(100, Math.round(stats.minHoje/metaMin*100)) : 0;

  return html`
    <div>
      <div class="pagehead">
        <h2 class="serif">Painel do dia</h2>
        <p>${perfil?.concurso} — ${perfil?.cargo}</p>
      </div>

      <div class="banner">
        Meta de hoje: ${fmtMin(metaMin)} de estudo. ${stats ? html`Você já estudou <b>${fmtMin(stats.minHoje)}</b> hoje.` : ''}
        <div class="barwrap"><div class="bar" style=${{width:pctMeta+'%'}}></div></div>
      </div>

      <div class="row" style=${{marginBottom:'18px'}}>
        <div class="card stat"><div class="n">${stats?fmtMin(stats.minSemana):'—'}</div><div class="l">estudado esta semana</div></div>
        <div class="card stat"><div class="n">${stats?fmtMin(stats.minMes):'—'}</div><div class="l">estudado este mês</div></div>
        <div class="card stat"><div class="n">${stats?fmtMin(stats.minTotal):'—'}</div><div class="l">horas acumuladas</div></div>
        <div class="card stat"><div class="n">${stats?stats.streak:'—'}</div><div class="l">dias seguidos estudando</div></div>
      </div>

      <div class="row" style=${{marginBottom:'18px'}}>
        <div class="card stat"><div class="n">${stats?stats.totalResp:'—'}</div><div class="l">questões respondidas</div></div>
        <div class="card stat"><div class="n">${stats?stats.totalAcertos:'—'}</div><div class="l">acertos</div></div>
        <div class="card stat"><div class="n" style=${{color:'var(--gold)'}}>${stats?stats.pctGeral+'%':'—'}</div><div class="l">taxa geral de acerto</div></div>
        <div class="card stat"><div class="n" style=${{color:'var(--teal)'}}>${stats?stats.pct7+'%':'—'}</div><div class="l">taxa nos últimos 7 dias</div></div>
        <div class="card stat"><div class="n" style=${{color:'var(--brick)'}}>${stats?stats.revisoesPendentes:'—'}</div><div class="l">revisões pendentes</div></div>
      </div>

      <div class="grid2" style=${{marginBottom:'18px'}}>
        <div class="card">
          <h3 class="serif" style=${{fontSize:'16px',marginTop:0}}>Questões reais FCC</h3>
          ${stats && stats.porOrigem.oficial.total ? html`
            <div class="stat" style=${{marginBottom:0}}>
              <div class="n">${Math.round(stats.porOrigem.oficial.acertos/stats.porOrigem.oficial.total*100)}%</div>
              <div class="l">${stats.porOrigem.oficial.acertos} acertos de ${stats.porOrigem.oficial.total} respondidas</div>
            </div>
          `: html`<div class="empty">Nenhuma questão real cadastrada/respondida ainda.</div>`}
        </div>
        <div class="card">
          <h3 class="serif" style=${{fontSize:'16px',marginTop:0}}>Questões inéditas — estilo FCC</h3>
          ${stats && stats.porOrigem.inedita.total ? html`
            <div class="stat" style=${{marginBottom:0}}>
              <div class="n">${Math.round(stats.porOrigem.inedita.acertos/stats.porOrigem.inedita.total*100)}%</div>
              <div class="l">${stats.porOrigem.inedita.acertos} acertos de ${stats.porOrigem.inedita.total} respondidas</div>
            </div>
          `: html`<div class="empty">Nenhuma questão inédita respondida ainda.</div>`}
        </div>
      </div>
      ${stats && stats.indiceRecuperacao!==null && html`
        <div class="banner" style=${{borderLeftColor:'var(--teal)'}}>
          Índice de recuperação de erros: <b style=${{color:'var(--teal)'}}>${stats.indiceRecuperacao}%</b> dos conceitos já revisados voltaram a ser dominados.
        </div>
      `}

      <div class="grid2">
        <div class="card">
          <h3 class="serif" style=${{fontSize:'16px',marginTop:0}}>Assuntos críticos</h3>
          ${stats && stats.assuntosCriticos.length ? html`
            <table><tbody>
              ${stats.assuntosCriticos.map(r=>html`
                <tr><td>${r.nome}</td><td style=${{textAlign:'right',color:'var(--brick)'}}>${r.n} erro${r.n>1?'s':''}</td></tr>
              `)}
            </tbody></table>
          `: html`<div class="empty">Nenhum erro em aberto — bom sinal.</div>`}
        </div>
        <div class="card">
          <h3 class="serif" style=${{fontSize:'16px',marginTop:0}}>Matérias mais fortes</h3>
          ${stats && stats.ranking.slice(0,5).length ? html`
            <table><tbody>
              ${stats.ranking.slice(0,5).map(r=>html`
                <tr><td>${r.materia}</td><td style=${{textAlign:'right'}}>${r.pct}%</td><td style=${{textAlign:'right',color:'var(--paper-dim)'}}>${r.total}q</td></tr>
              `)}
            </tbody></table>
          `: html`<div class="empty">Ainda sem dados suficientes — responda questões para começar a ver seu ranking.</div>`}
        </div>
        <div class="card">
          <h3 class="serif" style=${{fontSize:'16px',marginTop:0}}>Matérias que precisam de atenção</h3>
          ${stats && stats.ranking.slice(-5).reverse().length ? html`
            <table><tbody>
              ${[...stats.ranking].sort((a,b)=>a.pct-b.pct).slice(0,5).map(r=>html`
                <tr><td>${r.materia}</td><td style=${{textAlign:'right',color:'var(--brick)'}}>${r.pct}%</td><td style=${{textAlign:'right',color:'var(--paper-dim)'}}>${r.total}q</td></tr>
              `)}
            </tbody></table>
          `: html`<div class="empty">Ainda sem dados suficientes.</div>`}
        </div>
      </div>
    </div>
  `;
}

// PLANO DE HOJE — prioriza pontos fracos e matérias de peso 2
// ============================================================
function PlanoHoje({perfil, materias, assuntos}){
  const [dados, setDados] = useState(null);
  useEffect(()=>{
    (async()=>{
      const desde=new Date(Date.now()-30*86400000).toISOString();
      const [{data:respostas},{data:erros}]=await Promise.all([
        supabase.from('respostas').select('correta, questoes(assunto_id)').gte('data',desde),
        supabase.from('erros').select('assunto_id, prioridade').eq('resolvido',false),
      ]);
      const assuntoToMateria={}; assuntos.forEach(a=>assuntoToMateria[a.id]=a.materia_id);
      const mapa={}; materias.forEach(m=>mapa[m.id]={materia:m,total:0,acertos:0,errosAbertos:0,prioridadeErros:0});
      (respostas||[]).forEach(r=>{ const mid=assuntoToMateria[r.questoes?.assunto_id]; if(!mid||!mapa[mid])return; mapa[mid].total++; if(r.correta)mapa[mid].acertos++; });
      (erros||[]).forEach(e=>{ const mid=assuntoToMateria[e.assunto_id]; if(!mid||!mapa[mid])return; mapa[mid].errosAbertos++; mapa[mid].prioridadeErros+=Number(e.prioridade||1); });
      const peso2=new Set(['Direito Administrativo','Licitações e Contratos – Lei nº 14.133/2021','Direito Constitucional','Controle Externo','Administração Financeira e Orçamentária – AFO','Contabilidade Pública','Administração Pública','Administração Geral','Administração Estratégica','Comportamento Organizacional','Gestão de Pessoas']);
      setDados(Object.values(mapa).map(x=>{ const pct=x.total?x.acertos/x.total*100:50; const peso=peso2.has(x.materia.nome)?2:1; const score=(100-pct)*peso+x.errosAbertos*4+x.prioridadeErros*2+(x.total<20?15:0); return {...x,pct:Math.round(pct),peso,score}; }).sort((a,b)=>b.score-a.score));
    })();
  },[materias,assuntos]);
  if(!dados) return html`<div class="card"><div class="empty">Montando seu plano de hoje…</div></div>`;
  const primeira=dados[0], segunda=dados[1]||dados[0], meta=perfil?.meta_diaria_minutos||180;
  const blocos=[
    {min:75,titulo:primeira?.materia.nome||'Matéria prioritária',desc:`Teoria enxuta + exemplos. Desempenho recente: ${primeira?.total?primeira.pct+'%':'ainda sem amostra suficiente'}.`},
    {min:60,titulo:segunda?.materia.nome||'Segunda prioridade',desc:`Estudo dirigido. ${segunda?.errosAbertos||0} erro(s) em aberto.`},
    {min:30,titulo:'Questões FCC / estilo FCC',desc:'Bloco concentrado nos assuntos estudados hoje.'},
    {min:15,titulo:'Caderno de erros',desc:'Revise erros vencidos e registre a causa dos novos erros.'},
  ];
  if(meta!==180){ const f=meta/180; blocos.forEach(b=>b.min=Math.max(10,Math.round(b.min*f/5)*5)); }
  return html`<div>
    <div class="pagehead"><h2 class="serif">Plano de Hoje</h2><p>Seu tempo é distribuído de acordo com desempenho, erros e peso da prova.</p></div>
    <div class="banner" style=${{borderLeftColor:'var(--teal)'}}>O plano usa os últimos 30 dias e muda conforme você evolui.</div>
    <div class="grid2">${blocos.map((b,i)=>html`<div class="card"><span class="pill gold">Bloco ${i+1} · ${b.min} min</span><h3 class="serif" style=${{fontSize:'18px',marginBottom:'6px'}}>${b.titulo}</h3><p style=${{fontSize:'13px',color:'var(--paper-dim)',lineHeight:'1.55'}}>${b.desc}</p></div>`)}</div>
    <div class="card" style=${{marginTop:'18px'}}><h3 class="serif" style=${{fontSize:'16px',marginTop:0}}>Prioridades detectadas</h3><table><tbody>${dados.slice(0,6).map((x,i)=>html`<tr><td>${i+1}. ${x.materia.nome}</td><td style=${{textAlign:'right'}}>${x.total?x.pct+'%':'sem base'}</td><td style=${{textAlign:'right',color:'var(--paper-dim)'}}>${x.errosAbertos} erro(s)</td></tr>`)}</tbody></table></div>
  </div>`;
}

// CRONÔMETRO
// ============================================================
const PRESETS = [
  {id:'livre', label:'Foco livre', seg:null},
  {id:'25', label:'25 min', seg:25*60},
  {id:'45', label:'45 min', seg:45*60},
  {id:'60', label:'60 min', seg:60*60},
  {id:'90', label:'90 min', seg:90*60},
];

function Timer({materias, assuntos, activeSession, onChange, perfil}){
  const [materiaId, setMateriaId] = useState('');
  const [assuntoId, setAssuntoId] = useState('');
  const [tipo, setTipo] = useState('teoria');
  const [preset, setPreset] = useState(PRESETS[0]);
  const [session, setSession] = useState(activeSession || null);
  const [elapsed, setElapsed] = useState(0);
  const [paused, setPaused] = useState(false);
  const [mostrarPausa, setMostrarPausa] = useState(false);
  const avisadoRef = useRef(false);
  const intervalRef = useRef(null);

  useEffect(()=>{ setSession(activeSession||null); }, [activeSession]);

  useEffect(() => {
    if(!session){ setElapsed(0); avisadoRef.current = false; return; }
    setPaused(session.status === 'pausada');
    const tick = () => {
      const start = new Date(session.data_inicio).getTime();
      const pausedMs = (session.minutos_pausados||0)*60000;
      const pauseLocal = Number(localStorage.getItem('tce_pause_'+session.id) || 0);
      const referencia = session.status === 'pausada' && pauseLocal ? pauseLocal : Date.now();
      const novoElapsed = Math.max(0, Math.floor((referencia-start-pausedMs)/1000));
      setElapsed(novoElapsed);
      if(preset.seg && novoElapsed >= preset.seg && !avisadoRef.current){
        avisadoRef.current = true;
        setMostrarPausa(true);
      }
    };
    tick();
    intervalRef.current = setInterval(tick, 1000);
    return () => clearInterval(intervalRef.current);
  }, [session, preset]);

  const assuntosDaMateria = assuntos.filter(a=>a.materia_id===materiaId);

  async function iniciar(){
    if(!materiaId){ alert('Escolha a matéria.'); return; }
    const { data, error } = await supabase.from('sessoes_estudo').insert({
      materia_id: materiaId, assunto_id: assuntoId||null, tipo, status:'em_andamento', data_inicio: new Date().toISOString(),
    }).select().single();
    if(error){ alert(error.message); return; }
    avisadoRef.current = false;
    setSession(data);
    onChange && onChange();
  }
  async function pausar(){
    const agora=Date.now();
    localStorage.setItem('tce_pause_'+session.id,String(agora));
    const {data,error}=await supabase.from('sessoes_estudo').update({status:'pausada'}).eq('id',session.id).select().single();
    if(error){ alert(error.message); localStorage.removeItem('tce_pause_'+session.id); return; }
    setSession({...session,...data,_pauseStart:agora});
  }
  async function continuar(){
    const pauseStart=session._pauseStart||Number(localStorage.getItem('tce_pause_'+session.id))||Date.now();
    const addedMin=Math.max(0,Math.round((Date.now()-pauseStart)/60000));
    const {data,error}=await supabase.from('sessoes_estudo').update({status:'em_andamento',minutos_pausados:(session.minutos_pausados||0)+addedMin}).eq('id',session.id).select().single();
    if(error){ alert(error.message); return; }
    localStorage.removeItem('tce_pause_'+session.id);
    setSession(data);
  }
  async function finalizar(){
    const totalMin = Math.max(1, Math.round(elapsed/60));
    const { error } = await supabase.from('sessoes_estudo').update({
      status:'finalizada', data_fim: new Date().toISOString(), minutos: totalMin,
    }).eq('id', session.id);
    if(error){ alert(error.message); return; }
    localStorage.removeItem('tce_pause_'+session.id);
    setSession(null); setElapsed(0);
    onChange && onChange();
  }

  return html`
    <div>
      <div class="pagehead">
        <h2 class="serif">Cronômetro de estudos</h2>
        <p>Meta diária: ${fmtMin(perfil?.meta_diaria_minutos||180)}</p>
      </div>

      ${!session ? html`
        <div class="card" style=${{maxWidth:'520px'}}>
          <div class="field">
            <label>Matéria</label>
            <select value=${materiaId} onChange=${e=>{setMateriaId(e.target.value); setAssuntoId('');}}>
              <option value="">Selecione…</option>
              ${materias.map(m=>html`<option value=${m.id}>${m.nome}</option>`)}
            </select>
          </div>
          <div class="field">
            <label>Assunto (opcional)</label>
            <select value=${assuntoId} onChange=${e=>setAssuntoId(e.target.value)}>
              <option value="">—</option>
              ${assuntosDaMateria.map(a=>html`<option value=${a.id}>${a.nome}</option>`)}
            </select>
          </div>
          <div class="field">
            <label>Tipo de estudo</label>
            <select value=${tipo} onChange=${e=>setTipo(e.target.value)}>
              <option value="teoria">Teoria</option>
              <option value="questoes">Questões</option>
              <option value="revisao">Revisão</option>
              <option value="redacao">Redação</option>
              <option value="simulado">Simulado</option>
            </select>
          </div>
          <div class="field">
            <label>Duração do bloco</label>
            <div class="preset-row" style=${{justifyContent:'flex-start'}}>
              ${PRESETS.map(p=>html`
                <button class="preset-btn ${preset.id===p.id?'active':''}" onClick=${()=>setPreset(p)}>${p.label}</button>
              `)}
            </div>
          </div>
          <button class="btn" onClick=${iniciar}>Iniciar estudo</button>
        </div>
      `: html`
        <div class="card" style=${{maxWidth:'520px',textAlign:'center'}}>
          <div class="s" style=${{color:'var(--paper-dim)',fontSize:'13px'}}>
            ${materias.find(m=>m.id===session.materia_id)?.nome} ${session.assunto_id? '· '+(assuntos.find(a=>a.id===session.assunto_id)?.nome||''):''} · ${session.tipo}
          </div>
          <${RingTimer} elapsedSec=${elapsed} targetSec=${preset.seg}/>
          <div class="row" style=${{justifyContent:'center'}}>
            ${paused ? html`<button class="btn" onClick=${continuar}>Continuar</button>`
                     : html`<button class="btn ghost" onClick=${pausar}>Pausar</button>`}
            <button class="btn danger" onClick=${finalizar}>Finalizar sessão</button>
          </div>
        </div>
      `}
      ${mostrarPausa && html`<${PausaAtiva} minijogosAtivado=${perfil?.minijogos_ativado!==false} onClose=${()=>{setMostrarPausa(false); avisadoRef.current=true;}}/>`}
    </div>
  `;
}

function Estudar({materias, assuntos}){

  const materiaAtual = materias.find(m=>m.id===materiaId);
  const corMateria = materiaAtual?.cor || '#c99a3e';

  useEffect(() => {
    if(!assuntoSel){ setAulas([]); return; }
    supabase.from('aulas').select('*').eq('assunto_id', assuntoSel.id).order('ordem')
      .then(({data})=>setAulas(data||[]));

  async function salvarAula(){

    const { data } = await supabase.from('aulas').insert({
      assunto_id: assuntoSel.id, titulo: novoTitulo, conteudo_md: novoConteudo, ordem: aulas.length+1,

  return html`

        <div class="card">

            <select value=${materiaId} onChange=${e=>{setMateriaId(e.target.value); setAssuntoSel(null);}}>
              ${materias.map(m=>html`<option value=${m.id}>${m.nome}</option>`)}
            </select>
          </div>
          ${assuntosDaMateria.map(a=>html`
            <div class="list-item" style=${a.id===assuntoSel?.id?{color:corMateria}:{}} onClick=${()=>setAssuntoSel(a)}>${a.nome}</div>
          `)}
          ${!assuntosDaMateria.length && html`<div class="empty">Nenhum assunto cadastrado para esta matéria ainda.</div>`}
        </div>
        <div class="card">
          ${!assuntoSel ? html`<div class="empty">Selecione um assunto ao lado para ver ou registrar o conteúdo estudado.</div>` : html`
            <h3 class="serif" style=${{marginTop:0}}>${assuntoSel.nome}</h3>
            ${aulas.map(au=>html`
              <div style=${{marginBottom:'16px',paddingBottom:'16px',borderBottom:'1px solid var(--line)'}}>
                <div style=${{fontWeight:'600',marginBottom:'6px'}}>${au.titulo}</div>
                <${AudioControls} parts=${[au.titulo, au.conteudo_md]} label="Ouvir explicação"/>

              </div>
            `)}
            ${!aulas.length && html`<div class="empty" style=${{marginBottom:'12px'}}>Nenhuma aula registrada ainda para este assunto.</div>`}
            <div style=${{marginTop:'14px'}}>
              <div class="field"><label>Título do bloco de estudo</label><input value=${novoTitulo} onChange=${e=>setNovoTitulo(e.target.value)} placeholder="ex: Atos administrativos — conceito e atributos"/></div>
              <div class="field"><label>Conteúdo / anotações</label><textarea rows="6" value=${novoConteudo} onChange=${e=>setNovoConteudo(e.target.value)}></textarea></div>
              <button class="btn" onClick=${salvarAula}>Salvar bloco</button>

  `;
}

function CadastrarQuestao({assuntosDaMateria, assuntoId}){
  const [assunto, setAssunto] = useState(assuntoId || assuntosDaMateria[0]?.id || '');
  const [tipo, setTipo] = useState('inedita'); // inedita | oficial
  const [enunciado, setEnunciado] = useState('');
  const [dificuldade, setDificuldade] = useState('basico');
  const [alts, setAlts] = useState([{letra:'A',texto:'',correta:true},{letra:'B',texto:'',correta:false},{letra:'C',texto:'',correta:false},{letra:'D',texto:'',correta:false},{letra:'E',texto:'',correta:false}]);
  const [explicacao, setExplicacao] = useState('');
  const [tribunal, setTribunal] = useState('');
  const [cargoOrigem, setCargoOrigem] = useState('');
  const [ano, setAno] = useState('');
  const [numeroOriginal, setNumeroOriginal] = useState('');
  const [adaptada, setAdaptada] = useState(false);
  const [saving, setSaving] = useState(false);

  useEffect(()=>{ setAssunto(assuntoId || assuntosDaMateria[0]?.id || ''); }, [assuntoId, assuntosDaMateria]);

  function setCorreta(i){ setAlts(alts.map((a,idx)=>({...a, correta: idx===i}))); }
  function setTexto(i, v){ setAlts(alts.map((a,idx)=> idx===i ? {...a, texto:v} : a)); }

  async function salvar(){
    if(!assunto || !enunciado.trim() || alts.some(a=>!a.texto.trim())){ alert('Preencha o enunciado, o assunto e todas as alternativas.'); return; }
    if(tipo==='oficial' && !tribunal.trim()){ alert('Para questão real, informe pelo menos o tribunal/banca de origem.'); return; }
    setSaving(true);
    const { data: q, error } = await supabase.from('questoes').insert({
      assunto_id: assunto, enunciado, tipo, banca:'FCC', dificuldade, explicacao,
      tribunal: tipo==='oficial' ? tribunal : null,
      cargo_origem: tipo==='oficial' ? cargoOrigem : null,
      ano: tipo==='oficial' && ano ? Number(ano) : null,
      numero_original: tipo==='oficial' ? numeroOriginal : null,
      adaptada: tipo==='oficial' ? adaptada : false,
    }).select().single();
    if(error){ alert(error.message); setSaving(false); return; }
    await supabase.from('alternativas').insert(alts.map((a,i)=>({
      questao_id: q.id, letra:a.letra, texto:a.texto, correta:a.correta, ordem:i,
    })));
    setEnunciado(''); setExplicacao(''); setTribunal(''); setCargoOrigem(''); setAno(''); setNumeroOriginal(''); setAdaptada(false);
    setAlts(alts.map((a,i)=>({...a, texto:'', correta:i===0})));
    setSaving(false);
    alert(tipo==='oficial' ? 'Questão real cadastrada.' : 'Questão inédita salva.');
  }

  return html`
    <div class="card" style=${{maxWidth:'720px'}}>
      <div class="field">
        <label>Origem da questão</label>
        <div class="row">
          <button class="btn ${tipo==='inedita'?'':'ghost'}" onClick=${()=>setTipo('inedita')}>Inédita — estilo FCC</button>
          <button class="btn ${tipo==='oficial'?'':'ghost'}" onClick=${()=>setTipo('oficial')}>Real — FCC</button>
        </div>
      </div>
      <div class="banner" style=${{margin:'0 0 16px 0'}}>
        ${tipo==='inedita'
          ? html`Esta questão será marcada como <b>"Questão inédita — estilo FCC"</b> e nunca aparecerá como se fosse oficial.`
          : html`Cadastre aqui apenas questões que você já possui legitimamente (ex: extraídas de um PDF oficial de prova que você enviou). Informe a fonte — isso entra nas estatísticas separadas de desempenho em questões reais.`}
      </div>
      ${tipo==='oficial' && html`
        <div class="grid2">
          <div class="field"><label>Tribunal / concurso</label><input value=${tribunal} onChange=${e=>setTribunal(e.target.value)} placeholder="ex: TRT-18 (GO)"/></div>
          <div class="field"><label>Cargo</label><input value=${cargoOrigem} onChange=${e=>setCargoOrigem(e.target.value)} placeholder="ex: Técnico Judiciário – Área Administrativa"/></div>
          <div class="field"><label>Ano</label><input type="number" value=${ano} onChange=${e=>setAno(e.target.value)} placeholder="2023"/></div>
          <div class="field"><label>Nº da questão original</label><input value=${numeroOriginal} onChange=${e=>setNumeroOriginal(e.target.value)} placeholder="ex: 34"/></div>
        </div>
        <div class="field" style=${{display:'flex',gap:'8px',alignItems:'center'}}>
          <input type="checkbox" checked=${adaptada} onChange=${e=>setAdaptada(e.target.checked)} style=${{width:'auto'}}/>
          <label style=${{margin:0}}>Texto foi adaptado em relação ao original</label>
        </div>
      `}
      <div class="field">
        <label>Assunto</label>
        <select value=${assunto} onChange=${e=>setAssunto(e.target.value)}>
          ${assuntosDaMateria.map(a=>html`<option value=${a.id}>${a.nome}</option>`)}
        </select>
      </div>
      <div class="field"><label>Enunciado</label><textarea rows="4" value=${enunciado} onChange=${e=>setEnunciado(e.target.value)}></textarea></div>
      <div class="field">
        <label>Dificuldade</label>
        <select value=${dificuldade} onChange=${e=>setDificuldade(e.target.value)}>
          <option value="basico">Básico</option><option value="intermediario">Intermediário</option>
          <option value="avancado">Avançado</option><option value="nivel_prova">Nível prova</option>
        </select>
      </div>
      ${alts.map((a,i)=>html`
        <div class="field" style=${{display:'flex',gap:'8px',alignItems:'center'}}>
          <input type="radio" name="correta" checked=${a.correta} onChange=${()=>setCorreta(i)} style=${{width:'auto'}}/>
          <span style=${{width:'18px'}}>${a.letra}</span>
          <input value=${a.texto} onChange=${e=>setTexto(i,e.target.value)} placeholder=${"Alternativa "+a.letra}/>
        </div>
      `)}
      <div class="field"><label>Explicação (mostrada após a resposta)</label><textarea rows="3" value=${explicacao} onChange=${e=>setExplicacao(e.target.value)}></textarea></div>
      <button class="btn" disabled=${saving} onClick=${salvar}>${saving?'Salvando…':'Salvar questão'}</button>
    </div>
  `;
}

// escolhe o nível de dificuldade recomendado a partir do desempenho recente no assunto
function tierRecomendado(pct, n){
  if(n < 8) return null; // amostra pequena — não força tier, deixa aleatório
  if(pct < 50) return 'basico';
  if(pct < 70) return 'intermediario';
  if(pct < 90) return 'avancado';
  return 'nivel_prova';
}

// rótulo de origem da questão — nunca deixa uma inédita parecer oficial
function origemLabel(q){
  if(q.tipo === 'oficial'){
    const partes = [q.tribunal, q.ano].filter(Boolean).join(' · ');
    return { texto: `FCC REAL${partes?' — '+partes:''}`, cls:'ok' };
  }
  return { texto: 'Questão inédita — estilo FCC', cls:'gold' };
}

function ResponderQuestoes({assuntosDaMateria, assuntoId, tamanhoBloco}){
  const [questao, setQuestao] = useState(null);
  const [alternativas, setAlternativas] = useState([]);
  const [escolhida, setEscolhida] = useState(null);
  const [respondida, setRespondida] = useState(false);
  const [motivo, setMotivo] = useState('');
  const [erroId, setErroId] = useState(null);
  const [motivoSalvo, setMotivoSalvo] = useState(false);
  const [carregando, setCarregando] = useState(false);
  const [tierInfo, setTierInfo] = useState(null);
  const [bloco, setBloco] = useState([]); // acertos por questão do bloco atual (true/false)
  const [blocoConcluido, setBlocoConcluido] = useState(false);
  const vistasRef = useRef(new Set());
  const tam = tamanhoBloco || 10;

  const assuntoIds = assuntoId ? [assuntoId] : assuntosDaMateria.map(a=>a.id);

  async function sortear(mantendoBloco){
    setCarregando(true); setRespondida(false); setEscolhida(null); setMotivo(''); setErroId(null); setMotivoSalvo(false);
    if(!mantendoBloco){ setBloco([]); setBlocoConcluido(false); }
    if(!assuntoIds.length){ setQuestao(null); setCarregando(false); return; }

    const { data: respAssunto } = await supabase.from('respostas').select('correta, questoes!inner(assunto_id)').in('questoes.assunto_id', assuntoIds);
    const n = (respAssunto||[]).length;
    const acertos = (respAssunto||[]).filter(r=>r.correta).length;
    const pct = n ? Math.round(acertos/n*100) : 0;
    const tier = tierRecomendado(pct, n);
    setTierInfo(tier ? {tier, pct, n} : null);

    let qs = [];
    if(tier){
      const { data } = await supabase.from('questoes').select('*').in('assunto_id', assuntoIds).eq('dificuldade', tier);
      qs = data || [];
    }
    if(!qs.length){
      const { data } = await supabase.from('questoes').select('*').in('assunto_id', assuntoIds);
      qs = data || [];
    }
    if(!qs.length){ setQuestao(null); setCarregando(false); return; }
    const naoVistas=qs.filter(q=>!vistasRef.current.has(q.id));
    const pool=naoVistas.length?naoVistas:qs;
    if(!naoVistas.length) vistasRef.current=new Set();
    const escolhida=pool[Math.floor(Math.random()*pool.length)];
    vistasRef.current.add(escolhida.id);
    const { data: alts } = await supabase.from('alternativas').select('*').eq('questao_id', escolhida.id).order('ordem');
    setQuestao(escolhida); setAlternativas(alts||[]);
    setCarregando(false);
  }

  useEffect(()=>{ vistasRef.current=new Set(); sortear(false); }, [assuntoId, assuntosDaMateria.length]);

  async function responder(alt){
    if(respondida) return;
    setEscolhida(alt); setRespondida(true);
    const { data: resp } = await supabase.from('respostas').insert({
      questao_id: questao.id, alternativa_id: alt.id, correta: alt.correta,
    }).select().single();
    if(!alt.correta){
      const { data: erro } = await supabase.from('erros').insert({
        questao_id: questao.id, resposta_id: resp.id, assunto_id: questao.assunto_id,
        proxima_revisao: new Date(Date.now()+INTERVALOS_REVISAO[0]*86400000).toISOString().slice(0,10),
      }).select().single();
      setErroId(erro?.id || null);
    }
  }

  async function salvarMotivo(){
    if(!erroId || !motivo) return;
    await supabase.from('erros').update({ motivo }).eq('id', erroId);
    setMotivoSalvo(true);
  }

  function proxima(){
    const novoBloco = [...bloco, !!escolhida?.correta];
    setBloco(novoBloco);
    if(novoBloco.length >= tam){ setBlocoConcluido(true); }
    else { sortear(true); }
  }

  if(carregando) return html`<div class="card"><div class="empty">Carregando questão…</div></div>`;

  if(blocoConcluido){
    const acertosBloco = bloco.filter(Boolean).length;
    const pctBloco = Math.round(acertosBloco/bloco.length*100);
    return html`
      <div class="card pop" style=${{maxWidth:'520px',textAlign:'center'}}>
        <h3 class="serif" style=${{marginTop:0}}>Bloco concluído</h3>
        <div class="block-dots" style=${{justifyContent:'center',marginBottom:'12px'}}>
          ${bloco.map((ok,i)=>html`<span class="block-dot ${ok?'done-ok':'done-bad'}"></span>`)}
        </div>
        <p style=${{color:'var(--paper-dim)'}}>${bloco.length} questões · ${acertosBloco} acertos · <b style=${{color:'var(--gold)'}}>${pctBloco}%</b></p>
        <div class="row" style=${{justifyContent:'center',marginTop:'14px'}}>
          <button class="btn" onClick=${()=>sortear(false)}>Fazer mais ${tam}</button>
          <button class="btn ghost" onClick=${()=>{setBloco([]); setBlocoConcluido(false); sortear(false);}}>Trocar assunto/matéria</button>
        </div>
      </div>
    `;
  }

  if(!questao) return html`<div class="card"><div class="empty">Ainda não há questões cadastradas para este filtro. Cadastre algumas em "Cadastrar questão".</div></div>`;

  const origem = origemLabel(questao);

  return html`
    <div class="card" style=${{maxWidth:'720px'}}>
      <div class="block-progress">
        <span>Questão ${bloco.length+1} de ${tam}</span>
        <div class="block-dots">
          ${Array.from({length:tam}).map((_,i)=>html`
            <span class="block-dot ${i<bloco.length ? (bloco[i]?'done-ok':'done-bad') : ''}"></span>
          `)}
        </div>
      </div>
      ${tierInfo && html`
        <div class="banner" style=${{margin:'0 0 14px 0'}}>
          Seu desempenho neste recorte está em ${tierInfo.pct}% (${tierInfo.n} questões) — priorizando dificuldade "${tierInfo.tier.replace('_',' ')}".
        </div>
      `}
      <div style=${{marginBottom:'8px'}}>
        <span class="pill ${origem.cls}">${origem.texto}</span>
        ${questao.adaptada && html`<span class="pill" style=${{marginLeft:'6px'}}>adaptada</span>`}
        <span class="pill" style=${{marginLeft:'6px'}}>${questao.dificuldade.replace('_',' ')}</span>
      </div>
      <${AudioControls} parts=${[questao.enunciado, ...alternativas.map(a=>a.letra+'. '+a.texto)]} label="Ouvir questão"/>
      <p style=${{fontSize:'15px',lineHeight:'1.6'}}>${questao.enunciado}</p>
      ${alternativas.map(a=>{
        let cls='alt';
        if(respondida){
          if(a.correta) cls+=' correct';
          else if(escolhida && escolhida.id===a.id) cls+=' wrong';
        }
        return html`
          <div class=${cls} onClick=${()=>responder(a)}>
            <span class="letra">${a.letra}</span><span>${a.texto}</span>
          </div>`;
      })}
      ${respondida && html`
        <div class="banner pop" style=${{borderLeftColor: escolhida?.correta?'var(--teal)':'var(--brick)'}}>
          ${escolhida?.correta ? '✓ Correto.' : 'Esse assunto entrou na sua revisão — sem problema, é assim que a gente descobre onde reforçar.'} ${questao.explicacao || ''}
        </div>
        ${!escolhida?.correta && !motivoSalvo && html`
          <div class="field">
            <label>Por que você acha que errou? (define a prioridade da revisão)</label>
            <select value=${motivo} onChange=${e=>setMotivo(e.target.value)}>
              <option value="">Selecione…</option>
              ${Object.entries(MOTIVO_LABEL).map(([k,v])=>html`<option value=${k}>${v}</option>`)}
            </select>
          </div>
          <button class="btn ghost" disabled=${!motivo} onClick=${salvarMotivo} style=${{marginBottom:'12px'}}>Salvar causa</button>
        `}
        <div><button class="btn" onClick=${proxima}>Próxima questão</button></div>
      `}
    </div>
  `;
}

function Revisoes({materias, assuntos}){
  const [fila, setFila] = useState(null); // null = carregando
  const [atual, setAtual] = useState(null); // erro sendo revisado agora

  const carregarFila = useCallback(async () => {
    const hoje = new Date().toISOString().slice(0,10);
    const { data } = await supabase.from('erros').select('*, questoes(*)')
      .eq('resolvido', false).lte('proxima_revisao', hoje)
      .order('prioridade', {ascending:false}).order('proxima_revisao');
    setFila(data||[]);
    setAtual(null);
  }, []);

  useEffect(()=>{ carregarFila(); }, [carregarFila]);

  if(fila===null) return html`<div class="card"><div class="empty">Carregando fila de revisão…</div></div>`;

  return html`
    <div>
      <div class="pagehead"><h2 class="serif">Revisões</h2><p>Erros com revisão vencida hoje, por repetição espaçada (1 → 7 → 15 → 30 dias)</p></div>
      ${atual
        ? html`<${RevisarErro} erro=${atual} assuntos=${assuntos} onDone=${carregarFila}/>`
        : (fila.length
            ? html`
              <div class="card" style=${{maxWidth:'720px'}}>
                <div class="banner" style=${{margin:'0 0 14px 0'}}>${fila.length} revisão(ões) pendente(s) hoje.</div>
                ${fila.map(e=>html`
                  <div class="list-item" onClick=${()=>setAtual(e)}>
                    <div style=${{display:'flex',justifyContent:'space-between'}}>
                      <span>${assuntos.find(a=>a.id===e.assunto_id)?.nome || '—'}</span>
                      <span class="pill bad">prioridade ${e.prioridade}</span>
                    </div>
                    <div style=${{fontSize:'12px',color:'var(--paper-dim)',marginTop:'3px'}}>
                      ${MOTIVO_LABEL[e.motivo] || 'causa não registrada'} · revisado ${e.revisoes_feitas}x
                    </div>
                  </div>
                `)}
              </div>
            `
            : html`<div class="card"><div class="empty">Nenhuma revisão pendente hoje. Continue estudando conteúdo novo.</div></div>`)
      }
    </div>
  `;
}

function RevisarErro({erro, assuntos, onDone}){
  const [alternativas, setAlternativas] = useState([]);
  const [escolhida, setEscolhida] = useState(null);
  const [respondida, setRespondida] = useState(false);
  const questao = erro.questoes;

  useEffect(() => {
    supabase.from('alternativas').select('*').eq('questao_id', questao.id).order('ordem').then(({data})=>setAlternativas(data||[]));
  }, [erro.id]);

  async function responder(alt){
    if(respondida) return;
    setEscolhida(alt); setRespondida(true);
    await supabase.from('respostas').insert({ questao_id: questao.id, alternativa_id: alt.id, correta: alt.correta });

    if(alt.correta){
      const novasRevisoes = erro.revisoes_feitas + 1;
      if(novasRevisoes >= INTERVALOS_REVISAO.length){
        await supabase.from('erros').update({ resolvido: true, revisoes_feitas: novasRevisoes }).eq('id', erro.id);
      } else {
        const dias = INTERVALOS_REVISAO[novasRevisoes];
        await supabase.from('erros').update({
          revisoes_feitas: novasRevisoes,
          proxima_revisao: new Date(Date.now()+dias*86400000).toISOString().slice(0,10),
          prioridade: Math.max(1, erro.prioridade-1),
        }).eq('id', erro.id);
      }
    } else {
      await supabase.from('erros').update({
        revisoes_feitas: 0,
        proxima_revisao: new Date(Date.now()+INTERVALOS_REVISAO[0]*86400000).toISOString().slice(0,10),
        prioridade: erro.prioridade+1,
      }).eq('id', erro.id);
    }
  }

  const origem = origemLabel(questao);
  return html`
    <div class="card" style=${{maxWidth:'720px'}}>
      <div style=${{marginBottom:'8px'}}>
        <span class="pill gold">${assuntos.find(a=>a.id===erro.assunto_id)?.nome || '—'}</span>
        <span class="pill ${origem.cls}" style=${{marginLeft:'6px'}}>${origem.texto}</span>
        <span class="pill" style=${{marginLeft:'6px'}}>revisão nº ${erro.revisoes_feitas+1}</span>
      </div>
      <${AudioControls} parts=${[questao.enunciado, ...alternativas.map(a=>a.letra+'. '+a.texto)]} label="Ouvir questão"/>
      <p style=${{fontSize:'15px',lineHeight:'1.6'}}>${questao.enunciado}</p>
      ${alternativas.map(a=>{
        let cls='alt';
        if(respondida){
          if(a.correta) cls+=' correct';
          else if(escolhida && escolhida.id===a.id) cls+=' wrong';
        }
        return html`<div class=${cls} onClick=${()=>responder(a)}><span class="letra">${a.letra}</span><span>${a.texto}</span></div>`;
      })}
      ${respondida && html`
        <div class="banner" style=${{borderLeftColor: escolhida?.correta?'var(--teal)':'var(--brick)'}}>
          ${escolhida?.correta
            ? (erro.revisoes_feitas+1 >= INTERVALOS_REVISAO.length ? 'Acertou de novo — erro considerado resolvido, sai do caderno.' : `Acertou. Próxima revisão em ${INTERVALOS_REVISAO[erro.revisoes_feitas+1]} dias.`)
            : 'Errou de novo — intervalo reiniciado para amanhã e prioridade aumentada.'}
          ${questao.explicacao || ''}
        </div>
        <button class="btn" onClick=${onDone}>Voltar à fila</button>
      `}
    </div>
  `;
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function Simulados({materias, assuntos}){
  const [fase, setFase] = useState('config'); // config | rodando | relatorio
  const [tipo, setTipo] = useState('completo');
  const [materiaId, setMateriaId] = useState(materias[0]?.id||'');
  const [tamanho, setTamanho] = useState(20);
  const [simulado, setSimulado] = useState(null);
  const [questoes, setQuestoes] = useState([]); // com alternativas
  const [resultado, setResultado] = useState(null);
  const [carregando, setCarregando] = useState(false);
  const [aviso, setAviso] = useState('');

  async function buscarPool(assuntoIds){
    const { data: qs } = await supabase.from('questoes').select('*, alternativas(*)').in('assunto_id', assuntoIds);
    return qs || [];
  }

  async function iniciar(){
    setCarregando(true); setAviso('');
    let selecionadas = [];
    let nomeSim = '';
    if(tipo === 'completo'){
      const assuntosGerais = assuntos.filter(a => materias.find(m=>m.id===a.materia_id)?.bloco==='gerais').map(a=>a.id);
      const assuntosEspec = assuntos.filter(a => materias.find(m=>m.id===a.materia_id)?.bloco==='especificos').map(a=>a.id);
      const poolGerais = shuffle(await buscarPool(assuntosGerais)).slice(0,25);
      const poolEspec = shuffle(await buscarPool(assuntosEspec)).slice(0,45);
      selecionadas = [...poolGerais, ...poolEspec];
      nomeSim = 'Simulado completo';
      if(poolGerais.length<25 || poolEspec.length<45){
        setAviso(`Banco ainda não tem questões suficientes para o simulado completo — usando o que existe: ${poolGerais.length}/25 gerais e ${poolEspec.length}/45 específicas.`);
      }
    } else {
      const assuntosDaMateria = assuntos.filter(a=>a.materia_id===materiaId).map(a=>a.id);
      const pool = shuffle(await buscarPool(assuntosDaMateria)).slice(0, tamanho);
      selecionadas = pool;
      nomeSim = 'Simulado — ' + (materias.find(m=>m.id===materiaId)?.nome||'');
      if(pool.length < tamanho){
        setAviso(`Banco tem apenas ${pool.length} questões cadastradas para esta matéria — o simulado será menor que o pedido.`);
      }
    }
    if(!selecionadas.length){
      setAviso('Não há questões cadastradas suficientes para montar este simulado.');
      setCarregando(false); return;
    }
    const { data: sim } = await supabase.from('simulados').insert({
      nome: nomeSim, tipo, config_json: {tamanho: selecionadas.length},
    }).select().single();
    await supabase.from('simulado_questoes').insert(selecionadas.map((q,i)=>({simulado_id: sim.id, questao_id: q.id, ordem:i})));
    setSimulado(sim);
    setQuestoes(selecionadas.map(q=>({...q, resposta: null}))); // resposta: alternativa_id ou 'branco'
    setFase('rodando');
    setCarregando(false);
  }

  async function finalizar(respostasFinais, tempoTotalSeg){
    let acertos=0, erros=0, brancos=0;
    const porMateria = {}, porAssunto = {};
    const assuntoToMateria = {}; assuntos.forEach(a=>assuntoToMateria[a.id]=a.materia_id);

    for(const q of respostasFinais){
      const matId = assuntoToMateria[q.assunto_id];
      const peso = materias.find(m=>m.id===matId)?.peso || 1;
      porMateria[matId] = porMateria[matId] || {total:0, acertos:0, peso};
      porMateria[matId].total++;
      porAssunto[q.assunto_id] = porAssunto[q.assunto_id] || {total:0, acertos:0};
      porAssunto[q.assunto_id].total++;

      if(q.resposta === 'branco' || q.resposta === null){
        brancos++;
      } else {
        const alt = q.alternativas.find(a=>a.id===q.resposta);
        const ok = !!alt?.correta;
        if(ok){ acertos++; porMateria[matId].acertos++; porAssunto[q.assunto_id].acertos++; }
        else erros++;
        await supabase.from('respostas').insert({ questao_id: q.id, alternativa_id: q.resposta, correta: ok });
        if(!ok){
          await supabase.from('erros').insert({
            questao_id: q.id, assunto_id: q.assunto_id,
            proxima_revisao: new Date(Date.now()+INTERVALOS_REVISAO[0]*86400000).toISOString().slice(0,10),
          });
        }
      }
    }

    const detalhes = {
      porMateria: Object.entries(porMateria).map(([id,v])=>({nome: materias.find(m=>m.id===id)?.nome, ...v})),
      porAssunto: Object.entries(porAssunto).map(([id,v])=>({nome: assuntos.find(a=>a.id===id)?.nome, ...v})),
      tempoTotalSeg,
    };
    const { data: res } = await supabase.from('resultados_simulados').insert({
      simulado_id: simulado.id, acertos, erros, brancos, tempo_gasto_segundos: tempoTotalSeg, detalhes_json: detalhes,
    }).select().single();

    const { data: anteriores } = await supabase.from('resultados_simulados')
      .select('*, simulados(tipo,nome,data)').order('data',{ascending:false}).limit(6);

    setResultado({...res, total: acertos+erros+brancos, anteriores: (anteriores||[]).filter(r=>r.id!==res.id)});
    setFase('relatorio');
  }

  if(fase==='relatorio' && resultado) return html`<${SimuladoRelatorio} resultado=${resultado} onNovo=${()=>{setFase('config'); setResultado(null);}}/>`;
  if(fase==='rodando') return html`<${SimuladoRunner} questoes=${questoes} onFinalizar=${finalizar}/>`;

  return html`
    <div>
      <div class="pagehead"><h2 class="serif">Simulados</h2><p>Reproduz a estrutura da prova — 25 Conhecimentos Gerais + 45 Específicos no simulado completo</p></div>
      <div class="card" style=${{maxWidth:'520px'}}>
        <div class="field">
          <label>Tipo</label>
          <div class="row">
            <button class="btn ${tipo==='completo'?'':'ghost'}" onClick=${()=>setTipo('completo')}>Completo (70 questões)</button>
            <button class="btn ${tipo==='materia'?'':'ghost'}" onClick=${()=>setTipo('materia')}>Por matéria</button>
          </div>
        </div>
        ${tipo==='materia' && html`
          <div class="field">
            <label>Matéria</label>
            <select value=${materiaId} onChange=${e=>setMateriaId(e.target.value)}>
              ${materias.map(m=>html`<option value=${m.id}>${m.nome}</option>`)}
            </select>
          </div>
          <div class="field">
            <label>Quantidade de questões</label>
            <select value=${tamanho} onChange=${e=>setTamanho(Number(e.target.value))}>
              ${[10,15,20,30].map(n=>html`<option value=${n}>${n}</option>`)}
            </select>
          </div>
        `}
        ${aviso && html`<div class="banner">${aviso}</div>`}
        <button class="btn" disabled=${carregando} onClick=${iniciar}>${carregando?'Montando…':'Iniciar simulado'}</button>
      </div>
    </div>
  `;
}

function SimuladoRunner({questoes, onFinalizar}){
  const [idx, setIdx] = useState(0);
  const [respostas, setRespostas] = useState(questoes.map(()=>null));
  const inicioRef = useRef(Date.now());
  const q = questoes[idx];

  function escolher(altId){
    const novas = [...respostas]; novas[idx] = altId; setRespostas(novas);
  }
  function marcarBranco(){
    const novas = [...respostas]; novas[idx] = 'branco'; setRespostas(novas);
  }
  function finalizar(){
    const tempoSeg = Math.round((Date.now()-inicioRef.current)/1000);
    const respostasFinais = questoes.map((qq,i)=>({...qq, resposta: respostas[i]}));
    onFinalizar(respostasFinais, tempoSeg);
  }

  return html`
    <div class="card" style=${{maxWidth:'720px'}}>
      <div class="block-progress">
        <span>Questão ${idx+1} de ${questoes.length}</span>
        <div class="block-dots">
          ${questoes.map((_,i)=>html`<span class="block-dot ${respostas[i]?(respostas[i]==='branco'?'':'done-ok'):''}" style=${respostas[i] && respostas[i]!=='branco' ? {background:'var(--gold)'}:{}}></span>`)}
        </div>
      </div>
      <p style=${{fontSize:'15px',lineHeight:'1.6'}}>${q.enunciado}</p>
      ${q.alternativas.sort((a,b)=>a.ordem-b.ordem).map(a=>html`
        <div class="alt ${respostas[idx]===a.id?'flipped':''}" style=${respostas[idx]===a.id?{borderColor:'var(--gold)'}:{}} onClick=${()=>escolher(a.id)}>
          <span class="letra">${a.letra}</span><span>${a.texto}</span>
        </div>
      `)}
      <div class="row" style=${{justifyContent:'space-between',marginTop:'12px'}}>
        <div class="row">
          <button class="btn ghost" disabled=${idx===0} onClick=${()=>setIdx(idx-1)}>Anterior</button>
          <button class="btn ghost" onClick=${marcarBranco}>Deixar em branco</button>
        </div>
        ${idx < questoes.length-1
          ? html`<button class="btn" onClick=${()=>setIdx(idx+1)}>Próxima</button>`
          : html`<button class="btn" onClick=${finalizar}>Finalizar simulado</button>`}
      </div>
    </div>
  `;
}

function SimuladoRelatorio({resultado, onNovo}){
  const pct = resultado.total ? Math.round(resultado.acertos/resultado.total*100) : 0;
  const cls = classificacao(pct, resultado.total);
  const tempoMedio = resultado.total ? Math.round(resultado.tempo_gasto_segundos/resultado.total) : 0;
  return html`
    <div>
      <div class="pagehead"><h2 class="serif">Resultado do simulado</h2></div>
      <div class="row" style=${{marginBottom:'18px'}}>
        <div class="card stat"><div class="n">${resultado.acertos}</div><div class="l">acertos</div></div>
        <div class="card stat"><div class="n">${resultado.erros}</div><div class="l">erros</div></div>
        <div class="card stat"><div class="n">${resultado.brancos}</div><div class="l">em branco</div></div>
        <div class="card stat"><div class="n" style=${{color:'var(--gold)'}}>${pct}%</div><div class="l">${cls.label}</div></div>
        <div class="card stat"><div class="n">${fmtClock(resultado.tempo_gasto_segundos).slice(0,5)}</div><div class="l">tempo total</div></div>
        <div class="card stat"><div class="n">${tempoMedio}s</div><div class="l">tempo médio/questão</div></div>
      </div>
      <div class="grid2">
        <div class="card">
          <h3 class="serif" style=${{fontSize:'16px',marginTop:0}}>Resultado por matéria</h3>
          <table><tbody>
            ${resultado.detalhes_json.porMateria.map(m=>html`
              <tr><td>${m.nome}</td><td style=${{textAlign:'right'}}>${Math.round(m.acertos/m.total*100)}%</td><td style=${{textAlign:'right',color:'var(--paper-dim)'}}>${m.acertos}/${m.total}</td></tr>
            `)}
          </tbody></table>
        </div>
        <div class="card">
          <h3 class="serif" style=${{fontSize:'16px',marginTop:0}}>Comparação com simulados anteriores</h3>
          ${resultado.anteriores.length ? html`
            <table><tbody>
              ${resultado.anteriores.map(r=>html`
                <tr><td>${r.simulados?.nome||'—'}</td><td style=${{textAlign:'right'}}>${Math.round(r.acertos/(r.acertos+r.erros+r.brancos)*100)}%</td><td style=${{textAlign:'right',color:'var(--paper-dim)'}}>${new Date(r.data).toLocaleDateString('pt-BR')}</td></tr>
              `)}
            </tbody></table>
          `: html`<div class="empty">Este é o seu primeiro simulado registrado.</div>`}
        </div>
      </div>
      <button class="btn" style=${{marginTop:'18px'}} onClick=${onNovo}>Fazer outro simulado</button>
    </div>
  `;
}

function OndePercoPontos({materias, assuntos}){
  const [ranking, setRanking] = useState(null);
  const [selecionado, setSelecionado] = useState(null);

  useEffect(() => {
    supabase.from('erros').select('assunto_id').eq('resolvido', false).then(({data})=>{
      const contagem = {};
      (data||[]).forEach(e=>{ contagem[e.assunto_id] = (contagem[e.assunto_id]||0)+1; });
      const lista = Object.entries(contagem)
        .map(([id,n])=>({assunto: assuntos.find(a=>a.id===id), n}))
        .filter(r=>r.assunto)
        .sort((a,b)=>b.n-a.n).slice(0,10);
      setRanking(lista);
    });
  }, [assuntos]);

  return html`
    <div>
      <div class="pagehead"><h2 class="serif">Onde estou perdendo pontos</h2><p>Os 10 assuntos responsáveis pela maior quantidade de erros em aberto</p></div>
      <div class="card">
        ${ranking===null ? html`<div class="empty">Carregando…</div>` :

            <table><tbody>
              ${ranking.map((r,i)=>html`
                <tr class="list-item" onClick=${()=>setSelecionado(r.assunto)}>
                  <td>${i+1}. ${r.assunto.nome}</td>
                  <td style=${{textAlign:'right',color:'var(--brick)'}}>${r.n} erro${r.n>1?'s':''}</td>
                </tr>
              `)}
            </tbody></table>
          ` : html`<div class="empty">Nenhum erro em aberto registrado ainda.</div>`
        }
      </div>
      ${selecionado && html`
        <div style=${{marginTop:'20px'}}>
          <h3 class="serif">Revisando: ${selecionado.nome}</h3>
          <${ResponderQuestoes} assuntosDaMateria=${[selecionado]} assuntoId=${selecionado.id} tamanhoBloco=${5}/>

      `}

  `;
}

function SeAProvaFosseHoje(){
  const [dados, setDados] = useState(null);

  useEffect(() => {
    (async () => {
      const { data: completos } = await supabase.from('resultados_simulados')
        .select('*, simulados!inner(tipo)').eq('simulados.tipo','completo').order('data',{ascending:false}).limit(3);
      setDados(completos||[]);
    })();
  }, []);

  if(dados===null) return html`<div class="card"><div class="empty">Carregando…</div></div>`;

  let geraisEst = null, especEst = null;
  if(dados.length){
    const mediasGerais = dados.map(r=>{
      const m = r.detalhes_json?.porMateria?.filter(mm=>mm.peso===1) || [];
      const total = m.reduce((a,x)=>a+x.total,0), acertos = m.reduce((a,x)=>a+x.acertos,0);
      return total ? acertos/total : null;
    }).filter(x=>x!==null);
    const mediasEspec = dados.map(r=>{
      const m = r.detalhes_json?.porMateria?.filter(mm=>mm.peso===2) || [];
      const total = m.reduce((a,x)=>a+x.total,0), acertos = m.reduce((a,x)=>a+x.acertos,0);
      return total ? acertos/total : null;
    }).filter(x=>x!==null);
    if(mediasGerais.length) geraisEst = Math.round((mediasGerais.reduce((a,b)=>a+b,0)/mediasGerais.length)*25);
    if(mediasEspec.length) especEst = Math.round((mediasEspec.reduce((a,b)=>a+b,0)/mediasEspec.length)*45);
  }

  return html`
    <div>
      <div class="pagehead"><h2 class="serif">Se a prova fosse hoje</h2><p>Estimativa baseada nos seus últimos simulados completos</p></div>
      ${!dados.length ? html`<div class="card"><div class="empty">Faça pelo menos um simulado completo para gerar esta estimativa.</div></div>` : html`
        <div class="row" style=${{marginBottom:'18px'}}>
          <div class="card stat"><div class="n">${geraisEst!==null?geraisEst+'/25':'—'}</div><div class="l">Conhecimentos Gerais — acertos estimados</div></div>
          <div class="card stat"><div class="n">${especEst!==null?especEst+'/45':'—'}</div><div class="l">Conhecimentos Específicos — acertos estimados</div></div>
