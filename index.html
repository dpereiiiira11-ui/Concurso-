}

// ============================================================
// RELATÓRIOS (período + dados para análise externa + checkpoint 25/09)
// ============================================================
function Relatorios({perfil, materias, assuntos}){
  const [periodo, setPeriodo] = useState('30');
  const [relatorio, setRelatorio] = useState(null);
  const [gerando, setGerando] = useState(false);
  const [copiado, setCopiado] = useState(false);

  async function gerar(diasOverride, tituloOverride){
    setGerando(true); setCopiado(false);
    const dias = diasOverride || Number(periodo);
    const desde = dias ? new Date(Date.now()-dias*86400000) : new Date(perfil.data_inicio);

    const [{data: sessoes}, {data: respostas}, {data: resultadosSim}, {data: questoesTipo}] = await Promise.all([
      supabase.from('sessoes_estudo').select('*').eq('status','finalizada').gte('data_inicio', desde.toISOString()),
      supabase.from('respostas').select('*, questoes(assunto_id, tipo)').gte('data', desde.toISOString()),
      supabase.from('resultados_simulados').select('*, simulados(nome,tipo,data)').gte('data', desde.toISOString()).order('data'),
      supabase.from('questoes').select('id, tipo'),
    ]);

    const horasTotais = (sessoes||[]).reduce((a,s)=>a+(s.minutos||0),0);
    const diasComEstudo = new Set((sessoes||[]).map(s=>new Date(s.data_inicio).toDateString())).size;
    const mediaDiaria = diasComEstudo ? Math.round(horasTotais/diasComEstudo) : 0;
    const metaCumprimento = diasComEstudo ? Math.round((mediaDiaria/(perfil.meta_diaria_minutos||180))*100) : 0;

    const totalResp = (respostas||[]).length;
    const totalAcertos = (respostas||[]).filter(r=>r.correta).length;
    const pctGeral = totalResp ? Math.round(totalAcertos/totalResp*100) : 0;

    const oficial = (respostas||[]).filter(r=>r.questoes?.tipo==='oficial');
    const inedita = (respostas||[]).filter(r=>r.questoes?.tipo==='inedita');
    const pctOficial = oficial.length ? Math.round(oficial.filter(r=>r.correta).length/oficial.length*100) : null;
    const pctInedita = inedita.length ? Math.round(inedita.filter(r=>r.correta).length/inedita.length*100) : null;

    const assuntoToMateria = {}; assuntos.forEach(a=>assuntoToMateria[a.id]=a.materia_id);
    const porMateria = {};
    (respostas||[]).forEach(r=>{
      const matId = assuntoToMateria[r.questoes?.assunto_id];
      if(!matId) return;
      porMateria[matId] = porMateria[matId] || {total:0, acertos:0};
      porMateria[matId].total++; if(r.correta) porMateria[matId].acertos++;
    });
    const desempenhoMateria = materias.map(m=>{
      const v = porMateria[m.id];
      return { nome: m.nome, pct: v ? Math.round(v.acertos/v.total*100) : null, total: v?.total||0 };
    });

    // matérias negligenciadas: sem nenhuma sessão de estudo no período
    const materiasComSessao = new Set((sessoes||[]).map(s=>s.materia_id));
    const negligenciadas = materias.filter(m=>!materiasComSessao.has(m.id)).map(m=>m.nome);

    // evolução: primeira semana x última semana do período
    const respOrdenadas = [...(respostas||[])].sort((a,b)=>new Date(a.data)-new Date(b.data));
    const primeira7 = respOrdenadas.filter(r=>new Date(r.data) < new Date(desde.getTime()+7*86400000));
    const ultima7 = respOrdenadas.filter(r=>new Date(r.data) > new Date(Date.now()-7*86400000));
    const pctPrimeira = primeira7.length ? Math.round(primeira7.filter(r=>r.correta).length/primeira7.length*100) : null;
    const pctUltima = ultima7.length ? Math.round(ultima7.filter(r=>r.correta).length/ultima7.length*100) : null;

    // edital percorrido: % de assuntos com pelo menos 1 aula registrada
    const { data: aulasDistintas } = await supabase.from('aulas').select('assunto_id');
    const assuntosComAula = new Set((aulasDistintas||[]).map(a=>a.assunto_id)).size;
    const pctEdital = assuntos.length ? Math.round(assuntosComAula/assuntos.length*100) : 0;

    const fortes = desempenhoMateria.filter(m=>m.pct!==null && m.total>=3).sort((a,b)=>b.pct-a.pct).slice(0,3);
    const fracas = [...desempenhoMateria].filter(m=>m.pct!==null && m.total>=3).sort((a,b)=>a.pct-b.pct).slice(0,3);

    const rel = {
      titulo: tituloOverride || 'Relatório de desempenho',
      periodoDias: dias, desde,
      horasTotais, diasComEstudo, mediaDiaria, metaCumprimento,
      totalResp, totalAcertos, pctGeral, pctOficial, pctInedita,
      oficialTotal: oficial.length, ineditaTotal: inedita.length,
      desempenhoMateria, negligenciadas, pctPrimeira, pctUltima, pctEdital,
      fortes, fracas, resultadosSim: resultadosSim||[],
    };
    setRelatorio(rel);
    setGerando(false);
  }

  function textoParaChatGPT(rel){
    const linhasMaterias = rel.desempenhoMateria.map(m=>`${m.nome} – ${m.pct!==null?m.pct+'%':'sem dados'}`).join('\n');
    const linhasSim = rel.resultadosSim.slice(-3).map((s,i)=>`Simulado ${i+1} – ${Math.round(s.acertos/(s.acertos+s.erros+s.brancos)*100)}%`).join('\n');
    return `CONCURSO:
TCE-GO – Técnico Administrativo

PERÍODO DE PREPARAÇÃO:
${rel.periodoDias || 'desde o início'} dias

HORAS ESTUDADAS:
${fmtMin(rel.horasTotais)}

MÉDIA DIÁRIA:
${fmtMin(rel.mediaDiaria)}

QUESTÕES RESPONDIDAS:
${rel.totalResp}

ACERTOS:
${rel.totalAcertos}

PERCENTUAL GERAL:
${rel.pctGeral}%

QUESTÕES REAIS FCC:
${rel.oficialTotal} respondidas — ${rel.pctOficial!==null?rel.pctOficial+'%':'sem dados'}

QUESTÕES INÉDITAS ESTILO FCC:
${rel.ineditaTotal} respondidas — ${rel.pctInedita!==null?rel.pctInedita+'%':'sem dados'}

DESEMPENHO POR MATÉRIA:

${linhasMaterias}

ÚLTIMOS SIMULADOS:

${linhasSim || 'nenhum simulado registrado ainda'}

PONTOS FORTES:
${rel.fortes.map(f=>f.nome).join(', ') || '—'}

PONTOS FRACOS:
${rel.fracas.map(f=>f.nome).join(', ') || '—'}

MATÉRIAS NEGLIGENCIADAS:
${rel.negligenciadas.join(', ') || 'nenhuma'}

PERCENTUAL DO EDITAL ESTUDADO:
${rel.pctEdital}%

EVOLUÇÃO:

Primeira semana do período: ${rel.pctPrimeira!==null?rel.pctPrimeira+'%':'sem dados'}
Última semana: ${rel.pctUltima!==null?rel.pctUltima+'%':'sem dados'}`;
  }

  async function copiar(){
    try{ await navigator.clipboard.writeText(textoParaChatGPT(relatorio)); setCopiado(true); }catch(e){ alert('Não foi possível copiar automaticamente — selecione o texto manualmente.'); }
  }

  const hoje = new Date();
  const checkpointDate = new Date('2026-09-25');
  const pertoDoCheckpoint = Math.abs(daysBetween(hoje, checkpointDate)) <= 10;

  return html`
    <div>
      <div class="pagehead"><h2 class="serif">Relatórios</h2><p>Relatório completo de desempenho, por período</p></div>

      ${pertoDoCheckpoint && html`
        <div class="banner" style=${{borderLeftColor:'var(--gold)'}}>
          Checkpoint — 25 de setembro está próximo. <button class="btn ghost" style=${{marginLeft:'8px'}} onClick=${()=>gerar(null, 'Diagnóstico TCE-GO – 25 de setembro')}>Gerar diagnóstico do checkpoint</button>
        </div>
      `}

      <div class="row" style=${{marginBottom:'18px'}}>
        <div class="field">
          <label>Período</label>
          <select value=${periodo} onChange=${e=>setPeriodo(e.target.value)}>
            <option value="7">Últimos 7 dias</option>
            <option value="15">Últimos 15 dias</option>
            <option value="30">Últimos 30 dias</option>
            <option value="0">Desde o início</option>
          </select>
        </div>
        <div class="field" style=${{alignSelf:'flex-end'}}>
          <button class="btn" disabled=${gerando} onClick=${()=>gerar()}>${gerando?'Gerando…':'Gerar relatório de desempenho'}</button>
        </div>
      </div>

      ${relatorio && html`
        <div>
          <h3 class="serif">${relatorio.titulo}</h3>
          <div class="row" style=${{marginBottom:'18px'}}>
            <div class="card stat"><div class="n">${fmtMin(relatorio.horasTotais)}</div><div class="l">horas estudadas</div></div>
            <div class="card stat"><div class="n">${relatorio.diasComEstudo}</div><div class="l">dias estudados</div></div>
            <div class="card stat"><div class="n">${relatorio.metaCumprimento}%</div><div class="l">cumprimento da meta</div></div>
            <div class="card stat"><div class="n">${relatorio.pctGeral}%</div><div class="l">acerto geral</div></div>
            <div class="card stat"><div class="n">${relatorio.pctEdital}%</div><div class="l">edital estudado</div></div>
          </div>
          <div class="grid2" style=${{marginBottom:'18px'}}>
            <div class="card">
              <h3 class="serif" style=${{fontSize:'16px',marginTop:0}}>Questões reais vs. inéditas</h3>
              <table><tbody>
                <tr><td>FCC real</td><td style=${{textAlign:'right'}}>${relatorio.pctOficial!==null?relatorio.pctOficial+'%':'—'}</td><td style=${{textAlign:'right',color:'var(--paper-dim)'}}>${relatorio.oficialTotal}q</td></tr>
                <tr><td>Inédita estilo FCC</td><td style=${{textAlign:'right'}}>${relatorio.pctInedita!==null?relatorio.pctInedita+'%':'—'}</td><td style=${{textAlign:'right',color:'var(--paper-dim)'}}>${relatorio.ineditaTotal}q</td></tr>
              </tbody></table>
            </div>
            <div class="card">
              <h3 class="serif" style=${{fontSize:'16px',marginTop:0}}>Evolução</h3>
              <p style=${{fontSize:'13.5px',color:'var(--paper-dim)'}}>Primeira semana: ${relatorio.pctPrimeira!==null?relatorio.pctPrimeira+'%':'sem dados'}<br/>Última semana: ${relatorio.pctUltima!==null?relatorio.pctUltima+'%':'sem dados'}</p>
            </div>
          </div>
          <div class="card" style=${{marginBottom:'18px'}}>
            <h3 class="serif" style=${{fontSize:'16px',marginTop:0}}>Desempenho por matéria</h3>
            <table><tbody>
              ${relatorio.desempenhoMateria.map(m=>html`
                <tr><td>${m.nome}</td><td style=${{textAlign:'right'}}>${m.pct!==null?m.pct+'%':'sem dados'}</td><td style=${{textAlign:'right',color:'var(--paper-dim)'}}>${m.total}q</td></tr>
              `)}
            </tbody></table>
            ${relatorio.negligenciadas.length ? html`<p style=${{fontSize:'12.5px',color:'var(--brick)',marginTop:'10px'}}>Sem nenhuma sessão de estudo no período: ${relatorio.negligenciadas.join(', ')}</p>` : ''}
          </div>
          <div class="card">
            <h3 class="serif" style=${{fontSize:'16px',marginTop:0}}>Dados para análise externa</h3>
            <p style=${{fontSize:'12px',color:'var(--paper-dim)'}}>Texto organizado para colar no ChatGPT ou em outra ferramenta de análise.</p>
            <pre style=${{whiteSpace:'pre-wrap',fontSize:'12px',background:'var(--panel-2)',padding:'12px',borderRadius:'4px',maxHeight:'320px',overflowY:'auto'}}>${textoParaChatGPT(relatorio)}</pre>
            <button class="btn" onClick=${copiar}>${copiado?'Copiado ✓':'Copiar para análise no ChatGPT'}</button>
          </div>
        </div>
      `}
    </div>
  `;
}

function CadernoDeErros({materias, assuntos}){
  const [erros, setErros] = useState(null);
  const [filtroAssunto, setFiltroAssunto] = useState('');
  const [mostrarResolvidos, setMostrarResolvidos] = useState(false);

  const carregar = useCallback(async () => {
    let q = supabase.from('erros').select('*, questoes(enunciado)').order('prioridade', {ascending:false}).order('proxima_revisao');
    if(!mostrarResolvidos) q = q.eq('resolvido', false);
    const { data } = await q;
    setErros(data||[]);
  }, [mostrarResolvidos]);

  useEffect(()=>{ carregar(); }, [carregar]);

  const filtrados = (erros||[]).filter(e => !filtroAssunto || e.assunto_id===filtroAssunto);

  async function marcarResolvido(id){
    await supabase.from('erros').update({resolvido:true}).eq('id', id);
    carregar();
  }

  return html`
    <div>
      <div class="pagehead"><h2 class="serif">Caderno de Erros</h2><p>Todo erro registrado, com motivo, prioridade e próxima revisão</p></div>
      <div class="row" style=${{marginBottom:'16px'}}>
        <div class="field" style=${{minWidth:'240px'}}>
          <label>Assunto</label>
          <select value=${filtroAssunto} onChange=${e=>setFiltroAssunto(e.target.value)}>
            <option value="">Todos</option>
            ${assuntos.map(a=>html`<option value=${a.id}>${a.nome}</option>`)}
          </select>
        </div>
        <div class="field" style=${{alignSelf:'flex-end'}}>
          <button class="btn ghost" onClick=${()=>setMostrarResolvidos(!mostrarResolvidos)}>
            ${mostrarResolvidos ? 'Ocultar resolvidos' : 'Mostrar resolvidos'}
          </button>
        </div>
      </div>
      <div class="card">
        ${erros===null ? html`<div class="empty">Carregando…</div>` :
          filtrados.length ? html`
            <table>
              <thead><tr><th>Assunto</th><th>Motivo</th><th>Revisões</th><th>Próxima revisão</th><th>Prioridade</th><th></th></tr></thead>
              <tbody>
                ${filtrados.map(e=>html`
                  <tr>
                    <td>${assuntos.find(a=>a.id===e.assunto_id)?.nome || '—'}</td>
                    <td>${MOTIVO_LABEL[e.motivo] || '—'}</td>
                    <td>${e.revisoes_feitas}</td>
                    <td>${e.resolvido ? html`<span class="pill ok">resolvido</span>` : e.proxima_revisao}</td>
                    <td>${e.prioridade}</td>
                    <td>${!e.resolvido && html`<button class="btn ghost" onClick=${()=>marcarResolvido(e.id)}>marcar resolvido</button>`}</td>
                  </tr>
                `)}
              </tbody>
            </table>
          ` : html`<div class="empty">Nenhum erro registrado ${filtroAssunto?'para este assunto':''}.</div>`
        }
      </div>
    </div>
  `;
}

function CalendarioEstudos({perfil, materias}){
  const hoje=new Date();
  const [cursor,setCursor]=useState(new Date(hoje.getFullYear(),hoje.getMonth(),1));
  const [sessoes,setSessoes]=useState(null);
  useEffect(()=>{
    const ini=new Date(cursor.getFullYear(),cursor.getMonth(),1), fim=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);
    supabase.from('sessoes_estudo').select('*').eq('status','finalizada').gte('data_inicio',ini.toISOString()).lt('data_inicio',fim.toISOString()).order('data_inicio').then(({data})=>setSessoes(data||[]));
  },[cursor]);
  const porDia={}; (sessoes||[]).forEach(s=>{ const d=new Date(s.data_inicio).getDate(); porDia[d]=porDia[d]||{min:0,itens:[]}; porDia[d].min+=Number(s.minutos||0); porDia[d].itens.push(s); });
  const diasMes=new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate();
  const offset=(new Date(cursor.getFullYear(),cursor.getMonth(),1).getDay()+6)%7;
  const celulas=[...Array(offset).fill(null),...Array.from({length:diasMes},(_,i)=>i+1)], nomes=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const totalMes=Object.values(porDia).reduce((a,d)=>a+d.min,0), meta=perfil?.meta_diaria_minutos||180;
  return html`<div>
    <div class="pagehead"><h2 class="serif">Calendário de Estudos</h2><p>Constância, horas realizadas e dias em que a meta foi alcançada.</p></div>
    <div class="row" style=${{alignItems:'center',marginBottom:'18px'}}><button class="btn ghost" onClick=${()=>setCursor(new Date(cursor.getFullYear(),cursor.getMonth()-1,1))}>← mês anterior</button><h3 class="serif" style=${{margin:'0 8px',minWidth:'190px',textAlign:'center'}}>${cursor.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h3><button class="btn ghost" onClick=${()=>setCursor(new Date(cursor.getFullYear(),cursor.getMonth()+1,1))}>próximo mês →</button></div>
    <div class="banner">Total do mês: <b>${fmtMin(totalMes)}</b> · Meta diária: <b>${fmtMin(meta)}</b></div>
    <div style=${{display:'grid',gridTemplateColumns:'repeat(7,minmax(72px,1fr))',gap:'6px'}}>${nomes.map(n=>html`<div style=${{fontSize:'11px',color:'var(--paper-dim)',textAlign:'center',padding:'5px'}}>${n}</div>`)}${celulas.map(d=>d===null?html`<div></div>`:html`<div class="card" style=${{padding:'10px',minHeight:'82px',borderColor:porDia[d]?.min>=meta?'var(--teal)':'var(--line)'}}><div style=${{display:'flex',justifyContent:'space-between'}}><b>${d}</b>${porDia[d]?.min>=meta?html`<span class="pill ok">meta</span>`:''}</div><div style=${{fontSize:'12px',marginTop:'10px'}}>${porDia[d]?fmtMin(porDia[d].min):'—'}</div>${porDia[d]&&html`<div style=${{fontSize:'10px',color:'var(--paper-dim)',marginTop:'4px'}}>${porDia[d].itens.length} sessão(ões)</div>`}</div>`)}</div>
  </div>`;
}

function Configuracoes({perfil, onSaved}){
  const [minijogos, setMinijogos] = useState(perfil?.minijogos_ativado !== false);
  const [tamanhoBloco, setTamanhoBloco] = useState(perfil?.tamanho_bloco_questoes || 10);
  const [velocidade, setVelocidade] = useState(perfil?.audio_velocidade || 1);
  const [saving, setSaving] = useState(false);

  useEffect(()=>{
    setMinijogos(perfil?.minijogos_ativado !== false);
    setTamanhoBloco(perfil?.tamanho_bloco_questoes || 10);
    setVelocidade(perfil?.audio_velocidade || 1);
  }, [perfil]);

  async function salvar(){
    setSaving(true);
    await supabase.from('perfil').update({
      minijogos_ativado: minijogos,
      tamanho_bloco_questoes: Number(tamanhoBloco),
      audio_velocidade: Number(velocidade),
    }).eq('id', perfil.id);
    setSaving(false);
    onSaved && onSaved();
  }

  return html`
    <div>
      <div class="pagehead"><h2 class="serif">Configurações</h2><p>Pausas, mini-jogo, blocos de questões e áudio</p></div>
      <div class="card" style=${{maxWidth:'480px'}}>
        <div class="field" style=${{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <label style=${{margin:0}}>Mini-jogos durante pausas</label>
          <button class="btn ${minijogos?'':'ghost'}" onClick=${()=>setMinijogos(!minijogos)}>${minijogos?'Ativado':'Desativado'}</button>
        </div>
        <div class="field">
          <label>Tamanho do bloco de questões</label>
          <select value=${tamanhoBloco} onChange=${e=>setTamanhoBloco(e.target.value)}>
            ${[5,10,15,20,25].map(n=>html`<option value=${n}>${n} questões</option>`)}
          </select>
        </div>
        <div class="field">
          <label>Velocidade padrão do áudio (leitura de questões e aulas)</label>
          <select value=${velocidade} onChange=${e=>setVelocidade(e.target.value)}>
            <option value="0.75">0,75x</option><option value="1">1x</option>
            <option value="1.25">1,25x</option><option value="1.5">1,5x</option>
          </select>
        </div>
        ${!TTS_SUPPORTED && html`<div class="empty">Este navegador não oferece leitura em voz alta (Web Speech API). Os botões de áudio ficam ocultos automaticamente.</div>`}
        <button class="btn" disabled=${saving} onClick=${salvar}>${saving?'Salvando…':'Salvar'}</button>
      </div>
    </div>
  `;
}

function Perfil({perfil, onSaved}){
  const [form, setForm] = useState(perfil || {});
  useEffect(()=>{ setForm(perfil||{}); }, [perfil]);
  async function salvar(){
    const { error } = await supabase.from('perfil').update({
      nome: form.nome, concurso: form.concurso, cargo: form.cargo, banca: form.banca,
      data_prova: form.data_prova, meta_diaria_minutos: Number(form.meta_diaria_minutos),
    }).eq('id', form.id);
    if(error){ alert(error.message); return; }
    onSaved && onSaved();
    alert('Perfil salvo.');
  }
  return html`
    <div>
      <div class="pagehead"><h2 class="serif">Perfil</h2><p>Dados usados no cálculo de metas e prazos</p></div>
      <div class="card" style=${{maxWidth:'480px'}}>
        <div class="field"><label>Nome</label><input value=${form.nome||''} onChange=${e=>setForm({...form,nome:e.target.value})}/></div>
        <div class="field"><label>Concurso</label><input value=${form.concurso||''} onChange=${e=>setForm({...form,concurso:e.target.value})}/></div>
        <div class="field"><label>Cargo</label><input value=${form.cargo||''} onChange=${e=>setForm({...form,cargo:e.target.value})}/></div>
        <div class="field"><label>Banca</label><input value=${form.banca||''} onChange=${e=>setForm({...form,banca:e.target.value})}/></div>
        <div class="field"><label>Data da prova</label><input type="date" value=${form.data_prova||''} onChange=${e=>setForm({...form,data_prova:e.target.value})}/></div>
        <div class="field"><label>Meta diária (minutos)</label><input type="number" value=${form.meta_diaria_minutos||180} onChange=${e=>setForm({...form,meta_diaria_minutos:e.target.value})}/></div>
        <button class="btn" onClick=${salvar}>Salvar</button>

  `;
}

createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
