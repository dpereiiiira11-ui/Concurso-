<title>PASSEI TCE-GO — Diário de Estudos</title>
<style>
:root{--bg:#fff8fb;--surface:#ffffff;--surface2:#fff0f6;--text:#271f2c;--muted:#7c7181;--accent:#ff6f91;--accent2:#8b7cf6;--good:#40b782;--warn:#e6a23c;--bad:#ef6a6a;--line:#eadfe7;--shadow:0 16px 40px rgba(78,44,77,.10);--radius:22px}
[data-theme="dark"]{--bg:#17141d;--surface:#211d29;--surface2:#2b2434;--text:#f8f2f7;--muted:#b9afbd;--line:#3d3345;--shadow:0 16px 40px rgba(0,0,0,.28)}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top right,color-mix(in srgb,var(--accent) 12%, transparent),transparent 28%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:24px 16px;background:color-mix(in srgb,var(--surface) 94%,transparent);border-right:1px solid var(--line);backdrop-filter:blur(12px)}.brand{padding:8px 10px 22px}.brand .logo{font-size:25px;font-weight:900;letter-spacing:-.04em}.brand .logo span{color:var(--accent)}.brand small{color:var(--muted)}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:12px 14px;border-radius:14px;font-weight:700}.nav button:hover,.nav button.active{background:var(--surface2);color:var(--text)}.nav button.active{box-shadow:inset 3px 0 0 var(--accent)}.side-bottom{position:absolute;bottom:18px;left:16px;right:16px}.level-card{padding:14px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,var(--surface)),color-mix(in srgb,var(--accent2) 12%,var(--surface)));border:1px solid var(--line)}.main{padding:28px 32px 90px;max-width:1280px;width:100%}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:24px}.hello h1{margin:0;font-size:28px;letter-spacing:-.03em}.hello p{margin:5px 0 0;color:var(--muted)}.actions{display:flex;gap:8px}.iconbtn,.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 14px;border-radius:14px;font-weight:800}.btn.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 25%,transparent)}.btn.good{background:var(--good);color:white;border:0}.btn.ghost{background:transparent}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:color-mix(in srgb,var(--surface) 96%,transparent);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}.stat .k{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.07em}.stat .v{font-size:28px;font-weight:900;margin-top:8px}.stat .s{font-size:12px;color:var(--muted);margin-top:4px}.progress{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:inherit}.mission{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,var(--surface)),color-mix(in srgb,var(--accent2) 9%,var(--surface)))}.mission h2,.section-title{margin:0 0 8px;font-size:20px}.mission-line{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px}.check.done{background:var(--good);border-color:var(--good);color:#fff}.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);font-size:12px;font-weight:800}.chart{display:flex;align-items:end;gap:8px;height:130px;margin-top:14px}.barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}.barcol i{width:100%;max-width:28px;background:linear-gradient(var(--accent2),var(--accent));border-radius:9px 9px 4px 4px;min-height:4px}.barcol small{color:var(--muted);font-size:10px}.empty{padding:18px;border:1px dashed var(--line);border-radius:16px;color:var(--muted);text-align:center}.focus-wrap{max-width:760px;margin:auto;text-align:center}.timer{width:290px;height:290px;border-radius:50%;margin:22px auto;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--p,0%),var(--surface2) 0);position:relative;box-shadow:0 20px 50px color-mix(in srgb,var(--accent) 18%,transparent)}.timer:after{content:"";position:absolute;inset:16px;border-radius:50%;background:var(--surface)}.timer .inside{position:relative;z-index:2}.timer .time{font-size:48px;font-weight:900;letter-spacing:-.04em}.timer .label{color:var(--muted);font-size:13px}.presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.candle{height:110px;width:54px;background:linear-gradient(#fff8de,#ffd9a8);border-radius:12px 12px 8px 8px;position:relative;margin:18px auto 0;overflow:hidden;border:1px solid #efd1a6}.candle .wax{position:absolute;bottom:0;left:0;right:0;background:#f6b868;height:var(--wax,100%);transition:height 1s}.flame{width:22px;height:34px;border-radius:50% 50% 50% 50% / 65% 65% 35% 35%;background:radial-gradient(circle at 50% 60%,#fff2a8 0 25%,#ffb347 26% 58%,#ff6a3d 60%);margin:auto;filter:drop-shadow(0 0 10px #ffad4d);animation:flicker 1.2s infinite alternate}@keyframes flicker{to{transform:scale(.92) rotate(2deg)}}.qwrap{max-width:900px}.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.qtext{font-size:18px;line-height:1.55;font-weight:750}.alts{display:grid;gap:10px;margin-top:18px}.alt{border:1px solid var(--line);background:var(--surface);padding:14px;border-radius:16px;text-align:left;color:var(--text);display:flex;gap:10px}.alt:hover{border-color:var(--accent)}.alt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}.alt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}.letter{width:28px;height:28px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-weight:900;flex:0 0 auto}.explain{margin-top:16px;padding:16px;border-radius:16px;background:var(--surface2);line-height:1.55}.note-drawer{position:fixed;right:18px;top:18px;bottom:18px;width:min(430px,calc(100vw - 36px));background:var(--surface);border:1px solid var(--line);box-shadow:0 30px 70px rgba(0,0,0,.25);border-radius:24px;padding:18px;z-index:20;display:none}.note-drawer.open{display:block}.note-drawer textarea{width:100%;min-height:210px;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:16px;padding:12px}.canvaswrap{border:1px dashed var(--line);border-radius:16px;overflow:hidden;background:white;margin-top:12px}.canvaswrap canvas{display:block;width:100%;height:220px;touch-action:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:800}.field select,.field input{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text)}.settings-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}.palette{display:flex;gap:10px}.swatch{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);outline:1px solid var(--line)}.swatch.active{outline:3px solid var(--text)}.achievement{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--surface2)}.badge{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;font-size:20px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:11px;color:var(--muted);text-transform:uppercase}.mobile-nav{display:none}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);padding:12px 16px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:800;z-index:50;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}.cloud{font-size:12px;color:var(--muted)}
@media(max-width:980px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:20px 18px 100px}.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:10px;left:10px;right:10px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:20px;padding:8px;z-index:15;backdrop-filter:blur(14px);box-shadow:var(--shadow);overflow-x:auto}.mobile-nav button{flex:1;min-width:64px;border:0;background:transparent;color:var(--muted);padding:8px 5px;border-radius:12px;font-size:10px;font-weight:900}.mobile-nav button.active{background:var(--surface2);color:var(--text)}}
@media(max-width:560px){.g4{grid-template-columns:1fr 1fr}.main{padding:16px 12px 100px}.topbar{align-items:flex-start}.actions{flex-wrap:wrap;justify-content:flex-end}.timer{width:240px;height:240px}.timer .time{font-size:40px}.qtext{font-size:16px}}
</style>

<script>
const SUPABASE_URL='https://zhegxckkkawzklvgxwpg.supabase.co';
const SUPABASE_KEY='sb_publishable_NeZYE89a8Mx8yn3Ml0G46Q_qJfd7GQY';
const EXAM_DATE='2027-01-17T08:00:00-03:00';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LS='passei_tcego_v1';
const COLORS={rosa:'#ff6f91',lilas:'#8b7cf6',azul:'#5a9bd4',verde:'#40b782',coral:'#f47b67'};
const subjects=['Português','Matemática e Raciocínio Lógico','Direito Administrativo','Direito Constitucional','Licitações e Contratos','AFO','Controle Externo','Contabilidade Pública','Administração Geral','Gestão de Pessoas'];
function q(id,mat,topic,text,alts,correct,exp,source){return{id,mat,topic,text,alts,correct,exp,source,kind:'Inédita — estilo FCC'}}
const QB=[
q(1,'Direito Constitucional','Direitos fundamentais','A Constituição Federal determina que homens e mulheres são iguais em direitos e obrigações, nos termos da Constituição. Essa regra está no conjunto de direitos e garantias fundamentais.', ['Certo','Errado','Somente para direitos civis','Somente para brasileiros natos','Somente em relações privadas'],0,'O art. 5º, I, da Constituição estabelece a igualdade de direitos e obrigações entre homens e mulheres.','CF/88, art. 5º, I'),
q(2,'Direito Constitucional','Administração Pública','Os princípios expressamente previstos no caput do art. 37 da Constituição são legalidade, impessoalidade, moralidade, publicidade e:', ['eficiência','economicidade','proporcionalidade','razoabilidade','continuidade'],0,'O acrônimo LIMPE reúne os cinco princípios expressos do caput do art. 37.','CF/88, art. 37, caput'),
q(3,'Direito Constitucional','Controle externo','O controle externo da Administração Pública federal é exercido pelo Congresso Nacional com auxílio:', ['do TCU','do STF','do CNJ','da CGU exclusivamente','do Ministério Público Federal exclusivamente'],0,'O art. 71 da Constituição prevê que o controle externo, a cargo do Congresso Nacional, será exercido com o auxílio do TCU.','CF/88, art. 71'),
q(4,'Direito Constitucional','Poder Legislativo','No âmbito federal, o Tribunal de Contas da União integra:', ['estrutura de auxílio ao Poder Legislativo','Poder Judiciário','Poder Executivo','Ministério Público','Defensoria Pública'],0,'O TCU auxilia o Congresso Nacional no controle externo; não integra o Poder Judiciário.','CF/88, arts. 70 e 71'),
q(5,'Direito Constitucional','Direitos fundamentais','A casa é asilo inviolável do indivíduo. Sem consentimento do morador, nela se pode entrar durante o dia:', ['por determinação judicial','apenas em flagrante delito','somente em caso de desastre','nunca','somente com autorização do Ministério Público'],0,'Além das hipóteses de flagrante, desastre e socorro, ordem judicial permite ingresso durante o dia.','CF/88, art. 5º, XI'),
q(6,'Direito Constitucional','Servidores','A investidura em cargo ou emprego público depende, em regra, de:', ['aprovação prévia em concurso público','indicação da chefia','processo seletivo simplificado em qualquer hipótese','tempo mínimo de serviço privado','autorização do Tribunal de Contas'],0,'Regra constitucional: concurso público, ressalvadas as nomeações para cargos em comissão.','CF/88, art. 37, II'),
q(7,'Direito Constitucional','Administração Pública','A publicidade dos atos públicos pode sofrer restrições:', ['quando a Constituição ou a lei protegerem sigilo legítimo','nunca','somente por vontade da autoridade','apenas no Judiciário','apenas em municípios'],0,'Publicidade não é absoluta; há hipóteses constitucionais e legais de sigilo.','CF/88 e LAI'),
q(8,'Direito Constitucional','Controle','A fiscalização contábil, financeira, orçamentária, operacional e patrimonial abrange, entre outros aspectos:', ['legalidade e legitimidade','somente legalidade','somente mérito político','apenas despesas','apenas receitas'],0,'O art. 70 inclui legalidade, legitimidade, economicidade, subvenções e renúncia de receitas.','CF/88, art. 70'),
q(9,'Direito Administrativo','Princípios','Pelo princípio da legalidade administrativa, o agente público:', ['atua nos limites autorizados pelo ordenamento','pode fazer tudo que a lei não proíbe','age apenas conforme costume','dispensa motivação','pode contrariar regulamento por conveniência'],0,'Na Administração, a atuação deve encontrar fundamento no ordenamento.','CF/88, art. 37'),
q(10,'Direito Administrativo','Atos administrativos','A presunção de legitimidade dos atos administrativos significa que:', ['se presumem válidos até prova em contrário','são sempre irrevogáveis','não podem ser anulados judicialmente','não precisam observar a lei','produzem efeitos apenas após sentença'],0,'É presunção relativa, admitindo prova em contrário.','Doutrina administrativa consolidada'),
q(11,'Direito Administrativo','Poderes administrativos','O poder disciplinar permite à Administração:', ['apurar e punir infrações funcionais e contratuais sujeitas à disciplina administrativa','editar leis','julgar crimes','criar tributos','anular decisões judiciais'],0,'O poder disciplinar relaciona-se à aplicação de sanções no âmbito de vínculos sujeitos à disciplina administrativa.','Direito Administrativo'),
q(12,'Direito Administrativo','Atos administrativos','A anulação de um ato administrativo decorre, em regra, de:', ['ilegalidade','mera inconveniência','mudança política','falta de publicidade em qualquer caso','interesse privado'],0,'Anulação combate ilegalidade; revogação decorre de conveniência e oportunidade.','Súmula 473 STF e doutrina'),
q(13,'Direito Administrativo','Atos administrativos','A revogação de ato administrativo válido ocorre por razões de:', ['conveniência e oportunidade','ilegalidade','inconstitucionalidade necessariamente','nulidade absoluta','crime funcional'],0,'Revogação é controle de mérito administrativo sobre ato válido.','Súmula 473 STF'),
q(14,'Direito Administrativo','Responsabilidade civil','A responsabilidade civil objetiva do Estado, em regra, baseia-se na teoria:', ['do risco administrativo','do risco integral em qualquer hipótese','da culpa exclusiva do agente','da irresponsabilidade estatal','do fato do príncipe'],0,'A CF adota, em regra, responsabilidade objetiva estatal pela teoria do risco administrativo.','CF/88, art. 37, §6º'),
q(15,'Direito Administrativo','Serviços públicos','A continuidade é princípio associado à prestação dos serviços públicos e busca:', ['evitar interrupções indevidas','impedir qualquer suspensão legal','eliminar tarifas','dispensar fiscalização','proibir delegação'],0,'A continuidade procura assegurar prestação regular, sem afastar hipóteses legais de interrupção.','Direito Administrativo'),
q(16,'Direito Administrativo','Administração indireta','Autarquia é pessoa jurídica:', ['de direito público criada por lei','de direito privado criada por decreto','sem personalidade jurídica','necessariamente empresa estatal','privada com fins lucrativos'],0,'Autarquias são pessoas jurídicas de direito público, criadas diretamente por lei.','DL 200/1967 e doutrina'),
q(17,'Licitações e Contratos','Princípios','A Lei 14.133/2021 prevê expressamente, entre outros, o princípio:', ['do planejamento','do sigilo como regra','da informalidade absoluta','da contratação verbal','da ausência de competição'],0,'Planejamento é princípio expresso da nova Lei de Licitações.','Lei 14.133/2021, art. 5º'),
q(18,'Licitações e Contratos','Modalidades','É modalidade de licitação prevista na Lei 14.133/2021:', ['pregão','convite','tomada de preços','consulta','carta-convite'],0,'A nova lei prevê pregão, concorrência, concurso, leilão e diálogo competitivo.','Lei 14.133/2021, art. 28'),
q(19,'Licitações e Contratos','Modalidades','A modalidade diálogo competitivo é prevista para:', ['situações complexas em que a Administração necessita dialogar com licitantes para desenvolver solução apta','qualquer compra de pequeno valor','somente alienação de bens','somente contratação de pessoal','pagamento de diárias'],0,'O diálogo competitivo atende contratações complexas nas hipóteses legais.','Lei 14.133/2021'),
q(20,'Licitações e Contratos','Contratação direta','A inexigibilidade de licitação ocorre quando:', ['é inviável a competição','a autoridade prefere não licitar','o valor sempre é inferior a qualquer limite','há emergência em todos os casos','existe mais de dez fornecedores'],0,'Inexigibilidade pressupõe inviabilidade de competição.','Lei 14.133/2021, art. 74'),
q(21,'Licitações e Contratos','Contratação direta','Dispensa e inexigibilidade de licitação:', ['são hipóteses distintas de contratação direta','são sinônimos perfeitos','foram abolidas pela Lei 14.133','dependem sempre de decisão judicial','não exigem processo formal'],0,'São espécies distintas de contratação direta e exigem instrução própria.','Lei 14.133/2021'),
q(22,'Licitações e Contratos','Agentes públicos','O agente de contratação é designado para:', ['tomar decisões e acompanhar o trâmite da licitação nas atribuições legais','julgar ações judiciais','aprovar orçamento estadual','substituir o controle externo','editar leis'],0,'A nova lei disciplina a atuação do agente de contratação.','Lei 14.133/2021, art. 8º'),
q(23,'Licitações e Contratos','Fases','O planejamento da contratação pública ocorre antes:', ['da seleção do fornecedor','do pagamento final','da execução apenas','do controle judicial','da sanção disciplinar'],0,'A fase preparatória antecede a seleção e estrutura a contratação.','Lei 14.133/2021'),
q(24,'Licitações e Contratos','Sanções','A Lei 14.133/2021 prevê sanções administrativas a licitantes e contratados:', ['sim, observados processo e garantias aplicáveis','não','somente prisão','apenas advertência verbal','somente multa judicial'],0,'A lei prevê advertência, multa, impedimento e declaração de inidoneidade, conforme o caso.','Lei 14.133/2021, arts. 155-163'),
q(25,'AFO','Instrumentos de planejamento','O plano plurianual é conhecido pela sigla:', ['PPA','LDO','LOA','LRF','RREO'],0,'PPA = Plano Plurianual.','CF/88, art. 165'),
q(26,'AFO','Instrumentos de planejamento','A Lei de Diretrizes Orçamentárias tem como uma de suas funções:', ['orientar a elaboração da LOA','substituir a Constituição','julgar contas','executar despesas diretamente','criar autarquias'],0,'A LDO orienta a elaboração da lei orçamentária anual e trata de metas e prioridades.','CF/88, art. 165'),
q(27,'AFO','Receita pública','Receita orçamentária é, em termos gerais, ingresso que:', ['integra a execução do orçamento conforme classificação legal','nunca aumenta disponibilidade','é sempre empréstimo extraorçamentário','não pode ser tributária','não aparece na LOA'],0,'Receitas orçamentárias integram o orçamento e seguem classificações próprias.','Lei 4.320/1964'),
q(28,'AFO','Despesa pública','A sequência clássica dos estágios da despesa orçamentária é:', ['empenho, liquidação e pagamento','pagamento, empenho e liquidação','liquidação, pagamento e empenho','receita, empenho e pagamento','previsão, arrecadação e recolhimento'],0,'A despesa passa por empenho, liquidação e pagamento.','Lei 4.320/1964'),
q(29,'AFO','Despesa pública','Empenho da despesa é o ato emanado de autoridade competente que:', ['cria para o Estado obrigação de pagamento pendente ou não de implemento de condição','efetua o pagamento bancário','confirma o recebimento definitivo do objeto sempre','arrecada tributo','abre crédito extraordinário automaticamente'],0,'É a definição clássica do art. 58 da Lei 4.320/1964.','Lei 4.320/1964, art. 58'),
q(30,'AFO','Créditos adicionais','Créditos suplementares destinam-se a:', ['reforço de dotação orçamentária','despesas sem dotação específica, apenas','despesas urgentes de guerra exclusivamente','arrecadação de receitas','cancelamento de restos a pagar'],0,'Suplementares reforçam dotações existentes.','Lei 4.320/1964, art. 41'),
q(31,'AFO','Créditos adicionais','Créditos especiais destinam-se a despesas:', ['para as quais não haja dotação orçamentária específica','já suficientemente dotadas','sempre sigilosas','apenas de pessoal','apenas judiciais'],0,'Especiais atendem despesa sem dotação específica.','Lei 4.320/1964, art. 41'),
q(32,'AFO','LRF','A Lei de Responsabilidade Fiscal busca:', ['responsabilidade na gestão fiscal','eliminar planejamento','dispensar transparência','proibir metas fiscais','substituir a LOA'],0,'A LRF estabelece normas de finanças públicas voltadas à responsabilidade na gestão fiscal.','LC 101/2000'),
q(33,'Controle Externo','Competências','Tribunais de Contas exercem fiscalização que pode alcançar aspectos de:', ['legalidade, legitimidade e economicidade','somente popularidade','somente conveniência política','apenas crimes','somente contratos privados sem recursos públicos'],0,'O controle externo envolve legalidade, legitimidade, economicidade e outros critérios constitucionais.','CF/88, art. 70'),
q(34,'Controle Externo','Prestação de contas','Deve prestar contas qualquer pessoa física ou jurídica, pública ou privada, que:', ['utilize, arrecade, guarde, gerencie ou administre dinheiros, bens e valores públicos nas hipóteses constitucionais','tenha conta bancária privada','possua imóvel','seja servidor aposentado necessariamente','vote em eleição'],0,'A obrigação decorre do manejo de recursos públicos nas hipóteses do art. 70, parágrafo único.','CF/88, art. 70, parágrafo único'),
q(35,'Controle Externo','Julgamento de contas','No modelo constitucional, o Tribunal de Contas da União julga:', ['as contas dos administradores e demais responsáveis por dinheiros, bens e valores públicos','as contas anuais do Presidente da República em caráter definitivo','ações penais','ações trabalhistas','leis em controle concentrado'],0,'O TCU julga contas de administradores e responsáveis; sobre contas do Presidente, emite parecer prévio.','CF/88, art. 71'),

function defaultState(){return{theme:'light',accent:'rosa',xp:0,streak:0,lastStudy:null,sessions:[],answers:[],errors:[],notes:{},subjectNotes:{},missions:{},reports:[],timerMode:'random',timerMin:25,timerMax:60,timerMaxDaily:180,cloud:'checando',questionIndex:0,qFilters:{mat:'Todos',topic:'Todos'},simResults:[]}}
let S=Object.assign(defaultState(),JSON.parse(localStorage.getItem(LS)||'{}'));
function save(){localStorage.setItem(LS,JSON.stringify(S));syncCloud();}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function fmtMin(m){m=Math.max(0,Math.round(m||0));return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'min'}
function today(){return new Date().toISOString().slice(0,10)}
function daysLeft(){return Math.max(0,Math.ceil((new Date(EXAM_DATE)-new Date())/86400000))}
function level(){return Math.floor(S.xp/250)+1}
function levelPct(){return ((S.xp%250)/250)*100}
function accuracy(mat){let a=S.answers.filter(x=>!mat||x.mat===mat);return a.length?Math.round(100*a.filter(x=>x.ok).length/a.length):null}
function studiedToday(){return S.sessions.filter(x=>x.date===today()).reduce((a,b)=>a+b.min,0)}
function updateStreak(){const t=today();if(S.lastStudy===t)return;const y=new Date();y.setDate(y.getDate()-1);const ys=y.toISOString().slice(0,10);S.streak=S.lastStudy===ys?(S.streak||0)+1:1;S.lastStudy=t}
async function syncCloud(){if(!SUPABASE_URL||!SUPABASE_KEY)return;try{let r=await fetch(SUPABASE_URL+'/rest/v1/perfil?select=id&limit=1',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});S.cloud=r.ok?'online':'local';localStorage.setItem(LS,JSON.stringify(S));renderCloud()}catch(e){S.cloud='local';localStorage.setItem(LS,JSON.stringify(S));renderCloud()}}
function renderCloud(){const e=$('.cloud');if(e)e.textContent=S.cloud==='online'?'☁ Supabase conectado':'◉ modo local seguro'}
function setTheme(){document.documentElement.dataset.theme=S.theme;document.documentElement.style.setProperty('--accent',COLORS[S.accent]||COLORS.rosa);document.documentElement.style.setProperty('--accent2',S.accent==='lilas'?COLORS.rosa:COLORS.lilas)}
const nav=[['dashboard','⌂','Início'],['focus','◷','Foco'],['questions','✦','Questões'],['errors','↻','Revisões'],['sim','◎','Simulado'],['notes','✎','Caderno'],['report','▥','Relatório'],['settings','⚙','Ajustes']];
let page='dashboard',qSession=[],qPos=0,qAnswered=false,sim=null,timer=null,timerTotal=0,timerRemain=0,timerStart=0,timerRunning=false;
function shell(content){return `<div class="app"><aside class="side"><div class="brand"><div class="logo">PAS<span>SEI</span></div><small>TCE-GO • Técnico Administrativo</small></div><div class="nav">${nav.map(n=>`<button data-nav="${n[0]}" class="${page===n[0]?'active':''}">${n[1]} &nbsp; ${n[2]}</button>`).join('')}</div><div class="side-bottom"><div class="level-card"><b>Nível ${level()}</b><div class="progress" style="margin:9px 0 6px"><span style="width:${levelPct()}%"></span></div><small>${S.xp%250}/250 XP para o próximo</small></div></div></aside><main class="main"><div class="topbar"><div class="hello"><h1>${titleFor(page)}</h1><p>${subFor(page)}</p></div><div class="actions"><span class="cloud">${S.cloud==='online'?'☁ Supabase conectado':'◉ modo local seguro'}</span><button class="iconbtn" id="themeQuick">${S.theme==='dark'?'☀':'☾'}</button></div></div>${content}</main><nav class="mobile-nav">${nav.map(n=>`<button data-nav="${n[0]}" class="${page===n[0]?'active':''}">${n[1]}<br>${n[2]}</button>`).join('')}</nav></div><div id="noteDrawer" class="note-drawer"></div>`}
function titleFor(p){return({dashboard:'Sua campanha',focus:'Modo foco',questions:'Questões',errors:'Revisões inteligentes',sim:'Simulados',notes:'Caderno digital',report:'Seu progresso',settings:'Personalização'})[p]}
function subFor(p){return({dashboard:'Hoje não precisa ser perfeito. Precisa avançar.',focus:'Um desafio de cada vez. Fique até o ciclo terminar.',questions:'Treino constante, correção imediata e caderno de erros.',errors:'Volte no ponto certo antes de esquecer.',sim:'Teste seu nível sem interromper para ver respostas.',notes:'Escreva, desenhe e organize o que não quer esquecer.',report:'Números que mostram se você está realmente evoluindo.',settings:'Deixe o app com a sua cara.'})[p]}
function missionData(){let mins=studiedToday();let qs=S.answers.filter(a=>a.date===today()).length;let rev=S.errors.filter(e=>!e.resolved&&e.next<=today()).length;return[{t:'Completar 3h de estudo',done:mins>=180,p:`${fmtMin(mins)} / 3h`},{t:'Responder 20 questões',done:qs>=20,p:`${qs}/20`},{t:'Revisar erros vencidos',done:rev===0,p:rev?`${rev} pendentes`:'em dia'}]}
function dashboard(){let acc=accuracy(),mins=studiedToday(),m=missionData();let weak=subjects.map(x=>({x,p:accuracy(x),n:S.answers.filter(a=>a.mat===x).length})).filter(o=>o.n>=3).sort((a,b)=>(a.p??100)-(b.p??100)).slice(0,4);let last7=[...Array(7)].map((_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));let ds=d.toISOString().slice(0,10);let n=S.answers.filter(a=>a.date===ds);return{l:['D','S','T','Q','Q','S','S'][d.getDay()],p:n.length?Math.round(n.filter(a=>a.ok).length/n.length*100):0}});return `<div class="grid g4"><div class="card stat"><div class="k">Dias para a prova</div><div class="v">${daysLeft()}</div><div class="s">17 jan 2027</div></div><div class="card stat"><div class="k">XP acumulado</div><div class="v">${S.xp}</div><div class="s">nível ${level()}</div></div><div class="card stat"><div class="k">Sequência</div><div class="v">🔥 ${S.streak||0}</div><div class="s">dias estudando</div></div><div class="card stat"><div class="k">Acerto geral</div><div class="v">${acc===null?'—':acc+'%'}</div><div class="s">${S.answers.length?S.answers.length+' questões':'faça seu primeiro bloco'}</div></div></div><div class="grid g2" style="margin-top:16px"><div class="card mission"><span class="chip">🎯 Missão de hoje</span><h2 style="margin-top:10px">3 horas que contam de verdade</h2>${m.map(x=>`<div class="mission-line"><span class="check ${x.done?'done':''}">${x.done?'✓':''}</span><div style="flex:1"><b>${x.t}</b><div style="color:var(--muted);font-size:12px">${x.p}</div></div></div>`).join('')}<button class="btn primary" data-go="focus" style="margin-top:10px">Começar desafio</button></div><div class="card"><h2 class="section-title">Progresso dos últimos 7 dias</h2><div class="chart">${last7.map(x=>`<div class="barcol"><i style="height:${Math.max(5,x.p)}%"></i><small>${x.l}</small></div>`).join('')}</div>${!S.answers.length?`<div class="empty" style="margin-top:12px">Responda questões e este gráfico começa a ganhar vida.</div>`:''}</div></div><div class="grid g2" style="margin-top:16px"><div class="card"><h2 class="section-title">Onde você perde mais pontos</h2>${weak.length?weak.map(w=>`<div class="mission-line"><div style="flex:1"><b>${w.x}</b><div class="progress" style="margin-top:7px"><span style="width:${w.p}%"></span></div></div><b>${w.p}%</b></div>`).join(''):`<div class="empty">Faça pelo menos 3 questões por matéria. Depois eu mostro suas fraquezas aqui.</div>`}</div><div class="card"><h2 class="section-title">Banco inicial pronto</h2><div class="stat"><div class="v">${QB.length}</div><div class="s">questões inéditas estilo FCC já disponíveis</div></div><p style="color:var(--muted);line-height:1.55">Você não precisa esperar o banco “ter dados”. Já dá para estudar agora. Conforme responde, o app passa a personalizar revisão, fraquezas e relatórios.</p><button class="btn" data-go="questions">Ir para questões</button></div></div>`}
function focusPage(){return `<div class="focus-wrap"><div class="card"><div class="toolbar" style="justify-content:center"><button class="btn ${S.timerMode==='random'?'primary':''}" data-tmode="random">🎲 Aleatório</button><button class="btn ${S.timerMode==='candle'?'primary':''}" data-tmode="candle">🕯 Vela</button><button class="btn ${S.timerMode==='25'?'primary':''}" data-tmode="25">25 min</button><button class="btn ${S.timerMode==='50'?'primary':''}" data-tmode="50">50 min</button></div><div class="timer" id="timerRing" style="--p:0%"><div class="inside"><div class="time" id="timerText">${timerRunning?clock(timerRemain):'00:00'}</div><div class="label" id="timerLabel">${timerRunning?'desafio em andamento':'escolha e comece'}</div></div></div>${S.timerMode==='candle'?`<div class="flame"></div><div class="candle"><div class="wax" id="wax" style="--wax:${timerRunning?Math.max(4,timerRemain/timerTotal*100):100}%"></div></div>`:''}<div class="presets" style="margin-top:18px">${timerRunning?`<button class="btn" id="pauseTimer">${timer?'Pausar':'Continuar'}</button><button class="btn good" id="finishTimer">Concluir</button>`:`<button class="btn primary" id="startTimer">Começar desafio</button>`}</div><p style="color:var(--muted);margin-top:18px">Modo aleatório sorteia entre ${S.timerMin} e ${S.timerMax} minutos. Você só precisa ficar até o ciclo acabar. Limite diário configurado: ${S.timerMaxDaily} min.</p></div></div>`}
function clock(sec){sec=Math.max(0,Math.round(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function buildQSession(){let pool=QB.filter(x=>S.qFilters.mat==='Todos'||x.mat===S.qFilters.mat);if(S.qFilters.topic!=='Todos')pool=pool.filter(x=>x.topic===S.qFilters.topic);qSession=pool.sort(()=>Math.random()-.5).slice(0,10);qPos=0;qAnswered=false}
function questionsPage(){if(!qSession.length)buildQSession();let pool=QB.filter(x=>S.qFilters.mat==='Todos'||x.mat===S.qFilters.mat);let topics=['Todos',...new Set(pool.map(x=>x.topic))];if(!qSession[qPos])return `<div class="empty">Nenhuma questão para este filtro.</div>`;let z=qSession[qPos];return `<div class="qwrap"><div class="toolbar"><div class="field"><label>Matéria</label><select id="qMat">${['Todos',...subjects].map(x=>`<option ${x===S.qFilters.mat?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Assunto</label><select id="qTopic">${topics.map(x=>`<option ${x===S.qFilters.topic?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn" id="newBlock" style="align-self:end">Novo bloco</button></div><div class="card"><div class="qhead"><div><span class="chip">${z.kind}</span> <span class="chip">${z.mat}</span></div><div><b>${qPos+1}/10</b> · ${S.answers.filter(a=>a.date===today()).length} hoje</div></div><div class="progress"><span style="width:${(qPos/10)*100}%"></span></div><p class="qtext">${z.text}</p><div class="alts">${z.alts.map((a,i)=>`<button class="alt" data-alt="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${a}</span></button>`).join('')}</div><div id="qFeedback"></div><div class="toolbar" style="margin-top:14px"><button class="btn" id="hearQ">🔊 Ouvir</button><button class="btn" id="openNote">✎ Anotar</button><span class="chip">Fonte: ${z.source}</span></div></div></div>`}
function errorsPage(){let due=S.errors.filter(e=>!e.resolved&&e.next<=today());let all=S.errors.filter(e=>!e.resolved);return `<div class="grid g2"><div class="card"><h2 class="section-title">Revisões de hoje</h2>${due.length?due.map((e,i)=>{let qq=QB.find(q=>q.id===e.qid);return `<div class="mission-line"><div style="flex:1"><b>${qq?.topic||'Questão'}</b><div style="color:var(--muted);font-size:12px">${qq?.mat||''} · errou ${e.times}x</div></div><button class="btn" data-review="${e.qid}">Revisar</button></div>`}).join(''):`<div class="empty">Nada vencido hoje. Quando você errar, o sistema agenda 1 → 7 → 15 → 30 dias.</div>`}</div><div class="card"><h2 class="section-title">Caderno de erros</h2>${all.length?`<table class="table"><tr><th>Matéria</th><th>Assunto</th><th>Próxima</th></tr>${all.slice(0,12).map(e=>{let qq=QB.find(q=>q.id===e.qid);return `<tr><td>${qq?.mat||''}</td><td>${qq?.topic||''}</td><td>${e.next}</td></tr>`}).join('')}</table>`:`<div class="empty">Ainda não há erros registrados. Isso vai aparecer automaticamente conforme você pratica.</div>`}</div></div>`}
function simPage(){let last=S.simResults.at(-1);return `<div class="grid g2"><div class="card"><span class="chip">⚔ Chefão da semana</span><h2>Simulado rápido — 20 questões</h2><p style="color:var(--muted);line-height:1.55">Sem resposta durante a prova. Resultado só no final. É o seu teste de realidade.</p><button class="btn primary" id="startSim">Iniciar simulado</button></div><div class="card"><h2 class="section-title">Último resultado</h2>${last?`<div class="stat"><div class="v">${last.pct}%</div><div class="s">${last.correct}/${last.total} acertos · ${last.date}</div></div>`:`<div class="empty">Complete 1 simulado para liberar sua estimativa de desempenho.</div>`}</div></div><div id="simArea" style="margin-top:16px"></div>`}
function notesPage(){let keys=Object.keys(S.subjectNotes);return `<div class="grid g2"><div class="card"><h2 class="section-title">Anotação por matéria</h2><div class="field"><label>Matéria</label><select id="noteMat">${subjects.map(x=>`<option>${x}</option>`).join('')}</select></div><textarea id="subjectNote" style="width:100%;min-height:300px;margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface2);color:var(--text)" placeholder="Escreva macetes, dúvidas, regras que você sempre confunde..."></textarea><button class="btn primary" id="saveSubjectNote" style="margin-top:10px">Salvar anotação</button></div><div class="card"><h2 class="section-title">Folha livre para tablet</h2><p style="color:var(--muted)">Use o dedo, mouse ou caneta. O desenho fica salvo neste aparelho.</p><div class="canvaswrap"><canvas id="pad" width="800" height="440"></canvas></div><div class="toolbar" style="margin-top:10px"><button class="btn" id="clearPad">Limpar</button><button class="btn" id="savePad">Salvar desenho</button></div></div></div>`}
function reportPage(){let acc=accuracy(),by=subjects.map(x=>({x,p:accuracy(x),n:S.answers.filter(a=>a.mat===x).length}));let weak=by.filter(x=>x.n).sort((a,b)=>a.p-b.p);return `<div class="grid g4"><div class="card stat"><div class="k">Horas acumuladas</div><div class="v">${fmtMin(S.sessions.reduce((a,b)=>a+b.min,0))}</div></div><div class="card stat"><div class="k">Questões</div><div class="v">${S.answers.length}</div></div><div class="card stat"><div class="k">Acerto geral</div><div class="v">${acc===null?'—':acc+'%'}</div></div><div class="card stat"><div class="k">Simulados</div><div class="v">${S.simResults.length}</div></div></div><div class="grid g2" style="margin-top:16px"><div class="card"><h2 class="section-title">Desempenho por matéria</h2>${by.map(o=>`<div class="mission-line"><div style="flex:1"><b>${o.x}</b><div style="color:var(--muted);font-size:12px">${o.n?o.n+' questões':'comece por aqui'}</div></div><b>${o.p===null?'—':o.p+'%'}</b></div>`).join('')}</div><div class="card"><h2 class="section-title">Diagnóstico para me enviar</h2><p style="color:var(--muted)">Quando chegar perto de 25/09, copie este relatório e me mande. Eu comparo sua evolução e digo se está entrando numa faixa competitiva.</p><button class="btn primary" id="copyReport">Copiar relatório</button><pre id="reportText" style="white-space:pre-wrap;background:var(--surface2);padding:14px;border-radius:14px;margin-top:12px;font-size:12px">${reportText()}</pre></div></div>`}
function reportText(){return `CONCURSO: TCE-GO — Técnico Administrativo\nDATA: ${today()}\nDIAS PARA A PROVA: ${daysLeft()}\nHORAS ESTUDADAS: ${fmtMin(S.sessions.reduce((a,b)=>a+b.min,0))}\nQUESTÕES RESPONDIDAS: ${S.answers.length}\nACERTO GERAL: ${accuracy()===null?'sem amostra':accuracy()+'%'}\nSIMULADOS: ${S.simResults.length}\nÚLTIMO SIMULADO: ${S.simResults.length?S.simResults.at(-1).pct+'%':'ainda não realizado'}\nSEQUÊNCIA: ${S.streak||0} dias\nXP: ${S.xp}\n\nPOR MATÉRIA:\n${subjects.map(x=>`${x}: ${accuracy(x)===null?'ainda sem amostra':accuracy(x)+'%'} (${S.answers.filter(a=>a.mat===x).length} questões)`).join('\n')}\n\nERROS EM ABERTO: ${S.errors.filter(e=>!e.resolved).length}`}
function settingsPage(){return `<div class="grid g2"><div class="card"><h2 class="section-title">Aparência</h2><div class="settings-row"><div><b>Modo</b><div style="color:var(--muted);font-size:12px">Claro ou escuro</div></div><button class="btn" id="toggleTheme">${S.theme==='dark'?'Usar claro':'Usar escuro'}</button></div><div class="settings-row"><div><b>Cor principal</b><div style="color:var(--muted);font-size:12px">Escolha a energia do app</div></div><div class="palette">${Object.entries(COLORS).map(([k,v])=>`<button class="swatch ${S.accent===k?'active':''}" data-accent="${k}" style="background:${v}"></button>`).join('')}</div></div></div><div class="card"><h2 class="section-title">Cronômetro</h2><div class="field"><label>Mínimo do modo aleatório</label><input id="tmin" type="number" min="10" max="120" value="${S.timerMin}"></div><div class="field" style="margin-top:10px"><label>Máximo do modo aleatório</label><input id="tmax" type="number" min="15" max="180" value="${S.timerMax}"></div><div class="field" style="margin-top:10px"><label>Meta máxima diária (min)</label><input id="tdaily" type="number" min="30" max="180" value="${S.timerMaxDaily}"></div><button class="btn primary" id="saveTimerCfg" style="margin-top:12px">Salvar</button></div></div><div class="card" style="margin-top:16px"><h2 class="section-title">Sobre os dados</h2><p style="color:var(--muted);line-height:1.55">Este arquivo funciona mesmo sem internet: salva seu progresso neste navegador. Quando o Supabase estiver acessível e com permissões corretas, o app detecta a conexão. Assim você não fica presa numa tela vazia.</p><button class="btn" id="exportData">Exportar meu progresso (.json)</button> <button class="btn" id="resetData">Zerar somente meu progresso</button></div>`}
function render(){setTheme();let content=page==='dashboard'?dashboard():page==='focus'?focusPage():page==='questions'?questionsPage():page==='errors'?errorsPage():page==='sim'?simPage():page==='notes'?notesPage():page==='report'?reportPage():settingsPage();$('#app').innerHTML=shell(content);bind();renderCloud()}
function bind(){$$('[data-nav]').forEach(b=>b.onclick=()=>{page=b.dataset.nav;render()});$$('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});$('#themeQuick')?.addEventListener('click',()=>{S.theme=S.theme==='dark'?'light':'dark';save();render()});$$('[data-tmode]').forEach(b=>b.onclick=()=>{S.timerMode=b.dataset.tmode;save();render()});$('#startTimer')?.addEventListener('click',startTimer);$('#pauseTimer')?.addEventListener('click',toggleTimer);$('#finishTimer')?.addEventListener('click',()=>finishTimer(true));$('#qMat')?.addEventListener('change',e=>{S.qFilters.mat=e.target.value;S.qFilters.topic='Todos';save();buildQSession();render()});$('#qTopic')?.addEventListener('change',e=>{S.qFilters.topic=e.target.value;save();buildQSession();render()});$('#newBlock')?.addEventListener('click',()=>{buildQSession();render()});$$('[data-alt]').forEach(b=>b.onclick=()=>answerQ(+b.dataset.alt));$('#hearQ')?.addEventListener('click',speakQ);$('#openNote')?.addEventListener('click',openNote);$$('[data-review]').forEach(b=>b.onclick=()=>reviewQuestion(+b.dataset.review));$('#startSim')?.addEventListener('click',startSim);$('#copyReport')?.addEventListener('click',()=>navigator.clipboard.writeText(reportText()).then(()=>toast('Relatório copiado')));$('#toggleTheme')?.addEventListener('click',()=>{S.theme=S.theme==='dark'?'light':'dark';save();render()});$$('[data-accent]').forEach(b=>b.onclick=()=>{S.accent=b.dataset.accent;save();render()});$('#saveTimerCfg')?.addEventListener('click',()=>{S.timerMin=Math.max(10,+$('#tmin').value||25);S.timerMax=Math.min(180,Math.max(S.timerMin,+$('#tmax').value||60));S.timerMaxDaily=Math.min(180,+$('#tdaily').value||180);save();toast('Configurações salvas')});$('#exportData')?.addEventListener('click',exportData);$('#resetData')?.addEventListener('click',()=>{if(confirm('Zerar apenas seu progresso? O banco de questões continuará.')){S=defaultState();save();render()}});setupNotes()}
function startTimer(){let min=S.timerMode==='random'?Math.floor(Math.random()*(S.timerMax-S.timerMin+1))+S.timerMin:S.timerMode==='candle'?60:+S.timerMode||25;let remainingDaily=Math.max(1,S.timerMaxDaily-studiedToday());min=Math.min(min,remainingDaily);timerTotal=timerRemain=min*60;timerStart=Date.now();timerRunning=true;timer=setInterval(tickTimer,1000);render();toast(`Desafio: ${min} minutos`)}
function tickTimer(){if(!timerRunning||!timer)return;timerRemain--;let pct=((timerTotal-timerRemain)/timerTotal)*100;$('#timerRing')?.style.setProperty('--p',pct+'%');if($('#timerText'))$('#timerText').textContent=clock(timerRemain);if($('#wax'))$('#wax').style.setProperty('--wax',Math.max(4,timerRemain/timerTotal*100)+'%');if(timerRemain<=0)finishTimer(false)}
function toggleTimer(){if(timer){clearInterval(timer);timer=null;toast('Pausado')}else{timer=setInterval(tickTimer,1000);toast('Continuando')}render()}
function finishTimer(manual){if(timer){clearInterval(timer);timer=null}let used=Math.max(1,Math.round((timerTotal-timerRemain)/60));if(!manual&&used<1)used=Math.round(timerTotal/60);S.sessions.push({date:today(),min:used,mode:S.timerMode});S.xp+=used*2;updateStreak();timerRunning=false;timerRemain=0;save();render();toast(`+${used*2} XP · ${used} min de foco`)}
function answerQ(i){if(qAnswered)return;let z=qSession[qPos],ok=i===z.correct;qAnswered=true;S.answers.push({qid:z.id,mat:z.mat,topic:z.topic,ok,date:today()});S.xp+=ok?12:4;updateStreak();if(!ok){let e=S.errors.find(e=>e.qid===z.id&&!e.resolved);if(e){e.times++;e.next=tomorrow(1)}else S.errors.push({qid:z.id,times:1,stage:0,next:tomorrow(1),resolved:false})}save();$$('.alt').forEach((b,idx)=>{if(idx===z.correct)b.classList.add('correct');else if(idx===i)b.classList.add('wrong');b.disabled=true});$('#qFeedback').innerHTML=`<div class="explain"><b style="color:${ok?'var(--good)':'var(--bad)'}">${ok?'✓ Acertou. +12 XP':'Ainda não. Esse ponto entrou na sua revisão. +4 XP'}</b><div style="margin-top:8px">${z.exp}</div><div style="margin-top:8px;color:var(--muted);font-size:12px">${z.source}</div><button class="btn primary" id="nextQ" style="margin-top:12px">${qPos===9?'Fechar bloco':'Próxima questão'}</button></div>`;$('#nextQ').onclick=()=>{qPos++;qAnswered=false;if(qPos>=qSession.length){let recent=S.answers.slice(-qSession.length),pct=Math.round(recent.filter(x=>x.ok).length/recent.length*100);S.xp+=25;save();toast(`Bloco concluído: ${pct}% · +25 XP`);buildQSession()}render()}}
function tomorrow(d){let x=new Date();x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)}
function speakQ(){let z=qSession[qPos];if(!('speechSynthesis'in window))return toast('Áudio indisponível neste navegador');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(z.text+'. '+z.alts.map((a,i)=>String.fromCharCode(65+i)+'. '+a).join('. '));u.lang='pt-BR';speechSynthesis.speak(u)}
function openNote(){let z=qSession[qPos],d=$('#noteDrawer');d.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">✎ Anotação da questão</h2><button class="iconbtn" id="closeNote">×</button></div><p style="color:var(--muted);font-size:12px">${z.mat} · ${z.topic}</p><textarea id="qNote" placeholder="Ex.: sempre confundo este conceito...">${S.notes[z.id]||''}</textarea><button class="btn primary" id="saveQNote" style="margin-top:10px">Salvar</button>`;d.classList.add('open');$('#closeNote').onclick=()=>d.classList.remove('open');$('#saveQNote').onclick=()=>{S.notes[z.id]=$('#qNote').value;save();toast('Anotação salva');d.classList.remove('open')}}
function reviewQuestion(id){let qq=QB.find(x=>x.id===id);if(!qq)return;S.qFilters.mat=qq.mat;S.qFilters.topic=qq.topic;qSession=[qq];qPos=0;qAnswered=false;page='questions';render()}
function startSim(){let arr=[...QB].sort(()=>Math.random()-.5).slice(0,20);sim={arr,pos:0,ans:[]};renderSim()}
function renderSim(){let area=$('#simArea');if(!area||!sim)return;if(sim.pos>=sim.arr.length){let correct=sim.ans.filter(x=>x).length,pct=Math.round(correct/sim.arr.length*100);S.simResults.push({date:today(),correct,total:sim.arr.length,pct});S.xp+=100;save();sim=null;area.innerHTML=`<div class="card"><h2>Simulado concluído</h2><div class="stat"><div class="v">${pct}%</div><div class="s">${correct}/20 acertos · +100 XP</div></div></div>`;return}let z=sim.arr[sim.pos];area.innerHTML=`<div class="card qwrap"><div class="qhead"><b>Simulado ${sim.pos+1}/20</b><span class="chip">sem correção até o final</span></div><p class="qtext">${z.text}</p><div class="alts">${z.alts.map((a,i)=>`<button class="alt" data-simalt="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${a}</span></button>`).join('')}</div></div>`;$$('[data-simalt]').forEach(b=>b.onclick=()=>{sim.ans.push(+b.dataset.simalt===z.correct);sim.pos++;renderSim()})}
function setupNotes(){let nm=$('#noteMat');if(nm){let load=()=>$('#subjectNote').value=S.subjectNotes[nm.value]||'';nm.onchange=load;load();$('#saveSubjectNote').onclick=()=>{S.subjectNotes[nm.value]=$('#subjectNote').value;save();toast('Anotação salva')}}let c=$('#pad');if(!c)return;let ctx=c.getContext('2d'),down=false,last=null;try{let img=localStorage.getItem(LS+'_pad');if(img){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.width,c.height);im.src=img}}catch(e){}function pos(e){let r=c.getBoundingClientRect(),p=e.touches?.[0]||e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}}c.onpointerdown=e=>{down=true;last=pos(e)};c.onpointermove=e=>{if(!down)return;let p=pos(e);ctx.strokeStyle='#222';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p};window.addEventListener('pointerup',()=>down=false,{once:false});$('#clearPad').onclick=()=>ctx.clearRect(0,0,c.width,c.height);$('#savePad').onclick=()=>{localStorage.setItem(LS+'_pad',c.toDataURL());toast('Desenho salvo neste aparelho')}}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='passei-tcego-progresso.json';a.click();URL.revokeObjectURL(a.href)}
setTheme();render();syncCloud();
</script>
</body></html>
