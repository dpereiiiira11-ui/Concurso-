function App(){

function Dashboard({user,profile,setTab}){const [d,setD]=useState(null);useEffect(()=>{(async()=>{const [{data:discs},{data:at},{data:rev},{data:focus},{data:mocks}]=await Promise.all([supabase.from('disciplinas').select('id,slug,nome,cor').order('ordem'),supabase.from('question_attempts').select('status,criado_em,questions(disciplina_id)').eq('user_id',user.id),supabase.from('review_queue').select('id,proxima_revisao').eq('user_id',user.id).eq('concluida',false),supabase.from('focus_sessions').select('minutos_realizados,iniciada_em').eq('user_id',user.id),supabase.from('mock_exams').select('id,nota_ponderada,finalizado_em').eq('user_id',user.id).not('finalizado_em','is',null)]);const map={};(discs||[]).forEach(x=>map[x.id]={...x,total:0,acertos:0});(at||[]).forEach(x=>{const id=x.questions?.disciplina_id;if(map[id]){map[id].total++;if(x.status==='acertou')map[id].acertos++}});const today=new Date().toISOString().slice(0,10);const mins=(focus||[]).filter(x=>x.iniciada_em?.slice(0,10)===today).reduce((a,b)=>a+(b.minutos_realizados||0),0);setD({map:Object.values(map),q:(at||[]).length,acc:(at||[]).filter(x=>x.status==='acertou').length,rev:(rev||[]).filter(x=>x.proxima_revisao<=today).length,mins,mocks:mocks||[]})})()},[user]);const meta=profile?.meta_diaria_minutos||180;return html`<div><div class="pagehead"><p>${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</p><h1>Bom te ver por aqui${profile?.nome?`, ${profile.nome}`:''}.</h1></div><div class="card hero"><div style=${{position:'relative',zIndex:1}}><span class="pill">Jornada TCE-GO</span><h2 style=${{fontSize:'28px',margin:'12px 0 7px'}}>Missão de hoje</h2><p style=${{color:'var(--muted)'}}>Não precisa vencer o edital inteiro. Só a próxima sessão.</p><div class="progress" style=${{margin:'15px 0 8px'}}><i style=${{width:`${Math.min(100,pct(d?.mins||0,meta))}%`}}></i></div><small>${fmtMin(d?.mins||0)} de ${fmtMin(meta)}</small></div></div><div class="grid4" style=${{marginTop:'1
